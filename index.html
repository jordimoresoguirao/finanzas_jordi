/* ===== Guardar en GitHub: datos.json en un repositorio privado del usuario ===== */
/* El dispositivo sigue guardándolo todo en local (funciona sin conexión) y se sincroniza al abrir y tras cada cambio. */
const GH_API = 'https://api.github.com', GH_ARCHIVO = 'datos.json';
const b64 = {
  de(s){ const bin = atob(String(s || '').replace(/\s/g, '')), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); },
  a(str){ const u = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); },
};
const ghError = code => { const e = new Error(code); e.code = code; return e; };
async function gh(ruta, opts = {}, token = S.sync?.token){
  let res;
  try { res = await fetch(GH_API + ruta, {method:opts.method || 'GET', cache:'no-store', headers:{Accept:'application/vnd.github+json', Authorization:'Bearer ' + token, ...(opts.body ? {'Content-Type':'application/json'} : {})}, body:opts.body ? JSON.stringify(opts.body) : undefined}); }
  catch { throw ghError('red'); }
  if (res.ok) return res.json();
  throw ghError({401:'token', 403:'permiso', 404:'no-existe', 409:'conflicto', 422:'conflicto'}[res.status] || 'servidor');
}
const ghMsg = e => ({
  red:'No hay conexión con GitHub.',
  token:'El token no es válido o ha caducado. Crea uno nuevo y vuelve a conectar.',
  permiso:'El token no deja escribir en el repositorio. Dale permiso de lectura y escritura en «Contents».',
  'no-existe':'No encuentro ese repositorio. Revisa el nombre y que el token tenga acceso a él.',
  publico:'Ese repositorio es público y cualquiera vería tus datos. Hazlo privado o usa otro.',
  formato:`El archivo ${GH_ARCHIVO} del repositorio no es una copia de esta app.`,
  conflicto:'Ha habido cambios a la vez desde otro dispositivo. Vuelve a intentarlo.',
}[e?.code] || 'GitHub ha dado un error. Prueba otra vez en un rato.');
async function ghLeer(sy = S.sync){
  let r; try { r = await gh(`/repos/${sy.repo}/contents/${GH_ARCHIVO}`, {}, sy.token); } catch(e){ if (e.code === 'no-existe') return {sha:null, datos:null}; throw e; }
  let c = r.content; if (!c && r.sha) c = (await gh(`/repos/${sy.repo}/git/blobs/${r.sha}`, {}, sy.token)).content;
  let datos = null; try { datos = JSON.parse(b64.de(c)); } catch {}
  if (!datos || typeof datos !== 'object' || Array.isArray(datos)) throw ghError('formato');
  return {sha:r.sha, datos};
}
async function ghEscribir(d, sha){
  const body = {message:`Datos actualizados (${fechaCorta(hoyISO())})`, content:b64.a(JSON.stringify(d, null, 2))}; if (sha) body.sha = sha;
  try { return {sha:(await gh(`/repos/${S.sync.repo}/contents/${GH_ARCHIVO}`, {method:'PUT', body})).content.sha}; }
  catch(e){ if (e.code === 'conflicto') return {conflicto:true}; throw e; }
}

/* Foto de los datos {cfg, cuentas:{id:doc}, mov:{…}…}, ya normalizada, para comparar documento a documento */
function copiaDatos(){ return {app:'Contabilidad Jordi', exportado:new Date().toISOString(), config:S.cfg, cuentas:S.cuentas, movimientos:S.movs, fijos:S.recs, planificados:S.plans, prestamos:S.deudas, objetivos:S.objs, stby:S.stby}; }
function foto(d){
  const f = {cfg: d?.config && typeof d.config === 'object' ? normCfg(d.config) : null};
  for (const [col, k] of Object.entries(COPIA)) f[col] = Object.fromEntries((Array.isArray(d?.[k]) ? d[k] : []).filter(x => x && x.id).map(x => [String(x.id), normDoc(col, String(x.id), x)]));
  return f;
}
function aCopia(f){ const d = {app:'Contabilidad Jordi', exportado:new Date().toISOString(), config:f.cfg}; for (const [col, k] of Object.entries(COPIA)){ d[k] = Object.values(f[col]); if (col === 'mov') d[k].sort(ordenMovs); } return d; }
const estable = v => v == null ? '∅' : JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(kk => [kk, x[kk]])) : x);
const vacia = f => !f.cfg && Object.keys(COPIA).every(col => !Object.keys(f[col]).length);
/* Fusión a tres bandas con la última versión sincronizada (B): si este dispositivo cambió algo, gana lo suyo; si no, lo de GitHub */
function fusionar(B, L, R){
  const una = (b, l, r) => estable(l) === estable(b) ? r : l;
  const f = {cfg: una(B.cfg, L.cfg, R.cfg) || null};
  for (const col of Object.keys(COPIA)){ f[col] = {}; for (const id of new Set([...Object.keys(B[col]), ...Object.keys(L[col]), ...Object.keys(R[col])])){ const v = una(B[col][id], L[col][id], R[col][id]); if (v) f[col][id] = v; } }
  return f;
}
/* Deja este dispositivo igual que la foto f, escribiendo solo lo que cambia */
function aplicarFoto(f){
  const L = foto(copiaDatos()); let cambia = false;
  if (estable(L.cfg) !== estable(f.cfg)){ local.escribir('cfg', f.cfg); cambia = true; }
  for (const col of Object.keys(COPIA)) for (const id of new Set([...Object.keys(L[col]), ...Object.keys(f[col])])) if (estable(L[col][id]) !== estable(f[col][id])){ local.escribir(`${col}/${id}`, f[col][id] || null); cambia = true; }
  if (!cambia) return false;
  S.cfg = f.cfg; for (const col of Object.keys(COPIA)) S[COLS[col]] = Object.values(f[col]);
  after(); if (S.cfg) setTimeout(generarRecurrentes, 300);
  return true;
}

let syncT = 0, syncPend = false, syncando = false, syncOtra = false;
function programarSync(ms = 1500){ if (S.mode !== 'local' || !S.sync?.token) return; syncPend = true; clearTimeout(syncT); syncT = setTimeout(sincronizar, ms); }
function estadoSync(o){ if (!S.sync) return; Object.assign(S.sync, o); try { local.escribir('sync', S.sync); } catch {} schedule(); }
async function sincronizar(){
  if (S.mode !== 'local' || !S.sync?.token) return;
  if (syncando){ syncOtra = true; return; }
  syncando = true; syncPend = false; clearTimeout(syncT);
  try {
    for (let i = 0; i < 4; i++){
      const rem = await ghLeer();
      if (!S.sync?.token) return;
      /* Si en GitHub no hay archivo (o lo han borrado), no se toma como «borrar todo»: se vuelve a subir lo de aquí */
      const R = foto(rem.datos), B = rem.datos ? foto(local.leer('sync-base')) : foto(null), M = fusionar(B, foto(copiaDatos()), R);
      aplicarFoto(M);
      let sha = rem.sha;
      if (estable(M) !== estable(R) && !(vacia(M) && !rem.sha)){ estadoSync({estado:'subiendo'}); const w = await ghEscribir(aCopia(M), rem.sha); if (w.conflicto) continue; sha = w.sha; }
      local.escribir('sync-base', aCopia(M));
      estadoSync({estado:'ok', sha, ultima:new Date().toISOString(), error:null});
      return;
    }
    throw ghError('conflicto');
  } catch(e){ console.warn(e); estadoSync(e?.code === 'red' ? {estado:'sin-conexion', error:null} : {estado:'error', error:ghMsg(e)}); }
  finally { syncando = false; if (syncOtra){ syncOtra = false; programarSync(300); } }
}

function hace(iso){
  if (!iso) return 'nunca'; const d = new Date(iso), min = Math.round((Date.now() - d)/60000);
  if (min < 1) return 'ahora mismo'; if (min < 60) return `hace ${min} min`;
  const f = toISO(d); return f === hoyISO() ? `hoy a las ${pad(d.getHours())}:${pad(d.getMinutes())}` : `el ${fechaDM(f)}`;
}
function syncResumen(){
  const sy = S.sync; if (!sy?.token) return 'Tus datos en un repositorio privado tuyo y en todos tus dispositivos';
  if (sy.estado === 'error') return `<span class="neg">${esc(sy.error)}</span>`;
  if (sy.estado === 'sin-conexion') return 'Sin conexión: se guardará cuando vuelva';
  if (sy.estado === 'subiendo' || syncPend) return 'Guardando…';
  return `${esc(sy.repo)} · guardado ${hace(sy.ultima)}`;
}
const bannerSync = () => S.mode === 'local' && S.sync?.token && S.sync.estado === 'error' ? `<p class="banner" style="background:var(--warn-soft)">No se han podido guardar tus datos en GitHub. ${esc(S.sync.error)} <button class="link" data-act="github">Revisar</button></p>` : '';
const notaDatosLocal = () => S.sync?.token ? `Tus datos se guardan en este dispositivo y en tu repositorio privado ${esc(S.sync.repo)} de GitHub, que guarda un historial con cada cambio. Si borras la app, vuelve a conectarla y lo recuperas todo.`
  : 'Tus datos se guardan solo en este dispositivo, dentro de esta app. Guárdalos en GitHub o haz una copia de seguridad de vez en cuando: si borras la app de la pantalla de inicio, sus datos se borran con ella.';
const limpiarRepo = s => { const r = String(s || '').trim().replace(/^https?:\/\/(www\.)?github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, ''); return /^[\w.-]+\/[\w.-]+$/.test(r) ? r : ''; };
function activarSync(sy, base){ S.sync = {...sy, estado:'ok', error:null}; local.escribir('sync', S.sync); local.escribir('sync-base', base || null); sincronizar(); }

      armar(q('#ghLoc'), 'Toca otra vez para sustituir los de GitHub', () => { try { activarSync(sy, rem.datos); listo('Conectado. Subiendo tus datos a GitHub…'); } catch(e){ err.textContent = errMsg(e); } });
    };
    q('#fGh').addEventListener('submit', async e => {
      e.preventDefault(); err.textContent = '';
      const repo = limpiarRepo(q('#ghRepo').value), token = q('#ghTok').value.trim();
      if (!repo){ err.textContent = 'Escribe el repositorio así: tu-usuario/contabilidad-datos.'; q('#ghRepo').focus(); return; }
      if (!token){ err.textContent = 'Pega el token.'; q('#ghTok').focus(); return; }
      go.disabled = true; go.textContent = 'Conectando…';
      try {
        const info = await gh(`/repos/${repo}`, {}, token);
        if (!info.private) throw ghError('publico');
        const sy = {repo:info.full_name, token, rama:info.default_branch || 'main'};
        /* Mismo repositorio con un token nuevo: se conserva la base y se fusiona lo pendiente */
        if (S.sync?.repo === sy.repo){ activarSync(sy, local.leer('sync-base')); return listo('Conectado otra vez'); }
        const rem = await ghLeer(sy), R = foto(rem.datos), L = foto(copiaDatos());
        if (!vacia(R) && !vacia(L) && estable(R) !== estable(L)) return elegir(rem, sy);
        if (!vacia(R)) aplicarFoto(R);
        activarSync(sy, rem.datos);
        listo(vacia(R) ? 'Conectado. Subiendo tus datos a GitHub…' : 'Conectado. Datos traídos de GitHub');
      } catch(e){ console.warn(e); err.textContent = e?.code ? ghMsg(e) : errMsg(e); go.disabled = false; go.textContent = 'Conectar'; }
    });
  });
}

/* ===== Exportar ===== */
/* Fuera de claude.ai: hoja de compartir del iPhone (Guardar en Archivos) o descarga normal */
const descargaLocal = {
  async save({filename, data}){
    const file = new File([data], filename, {type: filename.endsWith('.json') ? 'application/json' : 'text/csv'});
    if (navigator.canShare?.({files:[file]})){
      try { await navigator.share({files:[file]}); return; }
      catch(e){ if (e?.name === 'AbortError'){ const x = new Error('Cancelado'); x.code = 'declined'; throw x; } }
    }
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  },
};
async function exportar(tipo){
  if (!CAPS.dl) return toast('Desde esta vista no se pueden descargar archivos.');
  const hoy = hoyISO(); let filename, data;
  if (tipo === 'json'){ filename = `contabilidad-jordi-${hoy}.json`; data = JSON.stringify(copiaDatos(), null, 2); }
  else {
    const cell = s => { s = String(s ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
    const rows = [['Fecha','Mes','Tipo','Importe','Categoría','Cuenta','Desde','Hacia','Detalle']].concat([...S.movs].reverse().map(m => [m.fecha, mesDe(m), TIPO_L[m.tipo], fmtIn(m.importe), m.cat ? catNombre(m.cat) : '', m.cuenta ? ctaNombre(m.cuenta) : '', m.desde ? ctaNombre(m.desde) : '', m.hacia ? ctaNombre(m.hacia) : '', m.detalle || '']));
    filename = `movimientos-${hoy}.csv`; data = '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  }
  try { await CAPS.dl.save({filename, data}); toast('Archivo listo'); if (tipo === 'json' && S.mode === 'local'){ S.copia = hoy; try { local.escribir('copia', hoy); } catch {} schedule(); } }
  catch(e){ if (e?.code !== 'declined') toast('No se ha podido preparar el archivo.'); }
}

  ftipo: b => { S.ftipo = b.dataset.v; render(); },

  github: () => sheetGithub(), 'ya-datos': () => sheetYaDatos(),
  pin: b => teclaPin(b.dataset.k), 'pin-del': () => borrarPin(),
  undo: () => { const u = toastUndo; toastUndo = null; $('#toast').hidden = true; if (u) u(); },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = ACT[b.dataset.act]; if (f){ e.preventDefault(); f(b, e); } });

let storageT = 0;
window.addEventListener('storage', e => { if (S.mode !== 'local' || (e.key && !e.key.startsWith(LS))) return; clearTimeout(storageT); storageT = setTimeout(() => { cargarLocal(); after(); }, 150); });
document.addEventListener('toggle', e => { if (e.target.id === 'recsBox') S.recsOpen = e.target.open; }, true);

document.addEventListener('submit', e => {

    const id = uid('m'), doc = {fecha:p.fecha, tipo:p.tipo, importe:r2(p.importe), cat:p.cat, cuenta:cta, desde:null, hacia:null, detalle:p.detalle, rec:null, creado:new Date().toISOString()};

/* ===== Código de acceso ===== */
/* Solo se guarda la huella del código (PBKDF2), no el número, porque el repositorio de la app es público.
   Protege la pantalla: los datos siguen en el dispositivo y en el GitHub privado. */
const PIN = {largo:6, iter:210000, sal:'becfb91da99516fcf3e04e912cbdb42b', huella:'f12665392549e0bf115ac8a8866f791b73de5c9f493524b6c40773b720989349'};
const BLOQUEO_MIN = 1;   /* vuelve a pedir el código si la app ha estado más de un minuto en segundo plano */
const L = {codigo:'', comprobando:false, esperando:false, oculta:0, t:0};
const bloqueada = () => !$('#lock').hidden;
const fallosPin = () => local.leer('pin-fallos') || {n:0, hasta:0};
const guardarFallosPin = f => { try { local.escribir('pin-fallos', f); } catch {} };
async function huellaPin(codigo){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(codigo), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:Uint8Array.from(PIN.sal.match(/../g), h => parseInt(h, 16)), iterations:PIN.iter}, k, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function pintarLock(msg, err){
  $('#lockDots').querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i < L.codigo.length));
  const espera = Math.ceil((fallosPin().hasta - Date.now())/1000), st = $('#lockS');
  if (espera > 0){ st.textContent = `Demasiados intentos. Espera ${espera >= 60 ? Math.ceil(espera/60) + ' min' : espera + ' s'}.`; st.classList.add('err'); L.esperando = true; }
  else {
    if (L.esperando && msg === undefined) msg = '';
    L.esperando = false;
    if (msg !== undefined){ st.textContent = msg || 'Introduce tu código'; st.classList.toggle('err', !!err); }
  }
  document.querySelectorAll('#lock .lock-pad button').forEach(b => b.disabled = espera > 0 || L.comprobando);
  clearTimeout(L.t); if (espera > 0) L.t = setTimeout(() => pintarLock(), 1000);
}
function teclaPin(k){
  if (L.comprobando || L.codigo.length >= PIN.largo || fallosPin().hasta > Date.now()) return;
  $('#lockDots').classList.remove('err', 'shake');
  L.codigo += k; pintarLock(L.codigo.length === 1 ? '' : undefined);
  if (L.codigo.length === PIN.largo) comprobarPin();
}
function borrarPin(){ if (L.comprobando) return; L.codigo = L.codigo.slice(0, -1); pintarLock(); }
async function comprobarPin(){
  if (!window.crypto?.subtle){ L.codigo = ''; return pintarLock('Para entrar, abre la app desde su enlace https.', true); }
  L.comprobando = true; pintarLock();
  let ok = false; try { ok = await huellaPin(L.codigo) === PIN.huella; } catch(e){ console.warn(e); }
  L.comprobando = false; L.codigo = '';
  if (ok){ guardarFallosPin(null); return desbloquear(); }
  /* A partir del quinto fallo seguido, espera: 30 s, 1 min, 2 min… hasta 15 min */
  const f = fallosPin(); f.n++; if (f.n >= 5) f.hasta = Date.now() + Math.min(30 * 2 ** (f.n - 5), 900) * 1000; guardarFallosPin(f);
  const d = $('#lockDots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('err', 'shake');
  pintarLock('Código incorrecto', true);
}
const taparApp = on => { for (const sel of ['#view', '.nav', '#sheet', '#toast']){ const el = $(sel); if (el) el.inert = on; } document.body.classList.toggle('locked', on); };
function bloquear(){ L.codigo = ''; $('#lockDots').classList.remove('err', 'shake'); $('#lock').hidden = false; taparApp(true); pintarLock(''); }
function desbloquear(){ $('#lock').hidden = true; taparApp(false); }
document.addEventListener('keydown', e => { if (!bloqueada() || e.metaKey || e.ctrlKey || e.altKey) return; if (/^[0-9]$/.test(e.key)){ e.preventDefault(); teclaPin(e.key); } else if (e.key === 'Backspace'){ e.preventDefault(); borrarPin(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') L.oculta = Date.now(); else if (L.oculta && Date.now() - L.oculta >= BLOQUEO_MIN*60000 && !bloqueada()) bloquear(); });

/* ===== Arranque ===== */
async function init(){
  bloquear();
  render();
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, dl] = await Promise.all([use('db'), use('downloads')]);
  CAPS.dl = dl;
  if (db){ CAPS.db = db; S.mode = 'db'; subscribe(); setTimeout(() => { for (const k of ['cfg', ...Object.keys(COLS)]) if (S.loaded[k]) S.def[k] = true; after(); }, 6000); }
  else {
    CAPS.dl = dl || descargaLocal;
    S.mode = local.disponible() ? 'local' : 'memoria';
    if (S.mode === 'local') cargarLocal();
    for (const k of ['cfg', ...Object.keys(COLS)]) S.def[k] = true;
    after();
    if (S.mode === 'local'){
      if (S.sync?.token) sincronizar();
      try { navigator.storage?.persist?.(); } catch {}
      if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
  schedule();
}
init();
