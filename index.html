<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contabilidad Jordi</title>
<meta name="description" content="Tu dinero, semana a semana.">
<meta name="theme-color" content="#F1F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1310" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contabilidad">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una columna móvil (máx. 560px) sobre fondo verde grisáceo; tarjetas blancas muy redondeadas, una tarjeta verde oscuro protagonista en Inicio y barra de pestañas flotante con el botón + aparte. */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface-2:#F0F3EF; --ink:#151A17; --ink-2:#4D5751; --ink-3:#7A847E; --line:#E4E9E3;
  --accent:#2B7A4B; --accent-ink:#FFFFFF; --accent-soft:#DDEBE1; --accent-tint:#E3EDE5;
  --hero-1:#11211A; --hero-2:#22412E; --hero-ink:#F3F8F4; --hero-mute:#A9BEB0; --hero-dot:rgba(255,255,255,.18); --hero-on:rgba(255,255,255,.58); --hero-pos:#8FE3B0; --hero-warn:#F6A37C;
  --pos:#2B8653; --neg:#C04C29;
  --warn:#B4512A; --warn-soft:#F8E6DC; --gold:#966A0B; --gold-soft:#F5ECD2; --good:#2B8653;
  --pat:#DCE9DF; --inv-bg:#151A17; --inv-ink:#FFFFFF; --inv-mute:#A9B3AD;
  --scrim:rgba(12,18,15,.42);
  --shadow:0 1px 2px rgba(18,28,22,.04),0 6px 20px -12px rgba(18,28,22,.18);
  --lift:0 14px 34px -14px rgba(18,28,22,.34);
  --f-display:"Plus Jakarta Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1310; --surface:#161F1A; --surface-2:#1E2923; --ink:#E8EFEA; --ink-2:#AAB6AF; --ink-3:#7B8780; --line:#27332C;
    --accent:#6FCB98; --accent-ink:#07150D; --accent-soft:#1F3A2B; --accent-tint:#1A2E22;
    --hero-1:#142A1E; --hero-2:#25492F; --hero-ink:#F3F8F4; --hero-mute:#A9BEB0; --hero-dot:rgba(255,255,255,.16); --hero-on:rgba(255,255,255,.55); --hero-pos:#8FE3B0; --hero-warn:#F6A37C;
    --pos:#6FCB98; --neg:#F08B66;
    --warn:#EE8E64; --warn-soft:#3B241B; --gold:#E3BC5E; --gold-soft:#332A17; --good:#6FCB98;
    --pat:#1B3125; --inv-bg:#E8EFEA; --inv-ink:#0D1310; --inv-mute:#4D5751;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6);
    --lift:0 14px 34px -12px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#161F1A; --surface-2:#1E2923; --ink:#E8EFEA; --ink-2:#AAB6AF; --ink-3:#7B8780; --line:#27332C;
  --accent:#6FCB98; --accent-ink:#07150D; --accent-soft:#1F3A2B; --accent-tint:#1A2E22;
  --hero-1:#142A1E; --hero-2:#25492F; --hero-ink:#F3F8F4; --hero-mute:#A9BEB0; --hero-dot:rgba(255,255,255,.16); --hero-on:rgba(255,255,255,.55); --hero-pos:#8FE3B0; --hero-warn:#F6A37C;
  --pos:#6FCB98; --neg:#F08B66;
  --warn:#EE8E64; --warn-soft:#3B241B; --gold:#E3BC5E; --gold-soft:#332A17; --good:#6FCB98;
  --pat:#1B3125; --inv-bg:#E8EFEA; --inv-ink:#0D1310; --inv-mute:#4D5751;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6);
  --lift:0 14px 34px -12px rgba(0,0,0,.75);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
h1,h2,h3,p,ul,dl,dd,figure,fieldset{margin:0}
ul{padding:0;list-style:none}
fieldset{border:0;padding:0;min-width:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3);font-size:13.5px}
b{font-weight:700}
.neg{color:var(--neg)} .pos{color:var(--pos)}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(120px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}

/* Cabecera */
.top{display:flex;align-items:center;gap:12px;padding-top:6px;min-height:58px}
.avatar{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:16px;letter-spacing:.03em}
.top-t{flex:1;min-width:0}
.top h1{font-weight:800;font-size:clamp(25px,7.4vw,31px);letter-spacing:-.03em;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1.greet{font-size:clamp(19px,5.4vw,22px);letter-spacing:-.02em}
.top .sub{color:var(--ink-2);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-a{display:flex;gap:8px;flex:none}
.rbtn{flex:none;width:46px;height:46px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.rbtn.on{background:var(--accent-soft);color:var(--accent)}
.rbtn.acc{background:var(--accent);color:var(--accent-ink)}
.banner{background:var(--gold-soft);border-radius:18px;padding:12px 14px;font-size:13.5px;color:var(--ink)}

/* Alta rápida */
.quick{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:var(--shadow)}
.quick:focus-within{box-shadow:0 0 0 2px var(--accent)}
.quick>svg{color:var(--accent)}
.quick input{flex:1;min-width:0;border:0;background:transparent;font:500 16px var(--f-body);color:var(--ink);padding:10px 0}
.quick input::placeholder{color:var(--ink-3)}
.quick input:focus{outline:none}
.qgo{flex:none;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

/* Tarjeta protagonista */
.hero{background:linear-gradient(155deg,var(--hero-1) 0%,var(--hero-2) 100%);color:var(--hero-ink);border-radius:30px;padding:18px 22px 22px;display:grid;box-shadow:var(--lift)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px}
.hseg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.hseg button{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-mute)}
.hseg button[aria-pressed="true"]{background:rgba(255,255,255,.15);color:var(--hero-ink)}
.hero-cap{font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--hero-ink)}
.hero-r{font-size:14px;color:var(--hero-mute);font-weight:600}
.hero-k{font-size:15px;color:var(--hero-mute);margin-top:14px}
.hero-big{font-weight:800;font-size:clamp(44px,13.5vw,60px);letter-spacing:-.04em;line-height:1.04;font-variant-numeric:tabular-nums;margin-top:2px}
.hero-big.sm{font-size:clamp(30px,8.6vw,38px);letter-spacing:-.025em;text-wrap:balance}
.hero.is-over .hero-big{color:var(--hero-warn)}
.hero-sub{font-size:13.5px;color:var(--hero-mute);margin-top:6px}
.tl{margin-top:22px}
.tl-dots{display:flex;align-items:center;gap:var(--tlgap,5px);height:30px}
.tl-dots i{flex:1;min-width:0;height:9px;border-radius:99px;background:var(--hero-dot)}
.tl-dots i.on{background:var(--hero-on)}
.tl-dots i.today{flex:0 0 9px;height:26px;background:var(--hero-ink);position:relative}
.tl-dots i.today::before{content:"";position:absolute;left:50%;top:-12px;width:7px;height:7px;border-radius:50%;background:var(--hero-ink);transform:translateX(-50%)}
.tl-lbl{position:relative;height:20px;margin-top:8px;font-size:13px;color:var(--hero-mute)}
.tl-lbl span{position:absolute;top:0;white-space:nowrap}
.tl-lbl .hoy{color:var(--hero-ink);font-weight:700}
.tl-lbl .hoy.mid{transform:translateX(-50%)}
.hero-foot{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-top:16px;font-size:14.5px;color:var(--hero-mute)}
.hero-foot b{font-size:clamp(17px,5vw,20px);font-weight:800;color:var(--hero-ink);margin-left:6px;font-variant-numeric:tabular-nums}
.hero-foot b.p{color:var(--hero-pos)}
.hero-note{font-size:13px;color:var(--hero-warn);margin-top:10px}
.hero-btn{justify-self:start;margin-top:18px;background:var(--hero-ink);color:var(--hero-1);min-height:48px;padding:0 22px;border-radius:999px;font-weight:800}
.hero-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hero-acts .hero-btn{margin-top:0}
.hero-btn2{min-height:48px;padding:0 20px;border-radius:999px;font-weight:700;color:var(--hero-ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);cursor:pointer}
label.prow{cursor:pointer}
.pasos a{color:var(--accent);font-weight:700;overflow-wrap:anywhere}
.hero-skel{height:58px;width:60%;border-radius:14px;background:rgba(255,255,255,.08);margin-top:8px}

/* Tarjetas y filas */
.card{background:var(--surface);border-radius:28px;padding:20px;display:grid;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h2,.kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);line-height:1.3}
.card h2.big{font-size:19px;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.card h3{font-size:15px;font-weight:700}
.link{color:var(--accent);font-weight:700;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.rows{display:grid}
.rows>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;min-width:0;text-align:left}
.rows>.row:first-child{padding-top:4px}
.rows>.row:last-child{padding-bottom:2px}
.ico{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.ico.in{background:var(--accent-soft);color:var(--accent)}
.ico.tr{background:var(--gold-soft);color:var(--gold)}
.ico.al{background:var(--warn-soft);color:var(--warn)}
.ico.l{font-weight:800;font-size:16px}
.r-main{flex:1;min-width:0;display:grid;gap:2px}
.r-t{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-s{font-size:13.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-v{flex:none;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.r-v small{display:block;font-size:12px;font-weight:600;color:var(--ink-3)}
.r-v.pos{color:var(--pos)} .r-v.neg{color:var(--neg)}
.chev{color:var(--ink-3)}
.row.wrap .r-t,.row.wrap .r-s{white-space:normal}
.stbyq{display:flex;align-items:center;gap:10px}
.stbyq .row{flex:1;min-width:0;padding:6px 0}
.gbar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.gbar.deu i{background:var(--neg)} .gbar.tight i{background:var(--gold)} .gbar.over i{background:var(--neg)}
.grp .r-main{gap:7px}
.grp-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.grp-top .r-v{font-size:16.5px}
.grp-s{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-3)}
.empty{display:grid;justify-items:center;gap:10px;padding:26px 8px;color:var(--ink-3);text-align:center;font-size:15px}

/* Movimientos */
.mesnav{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mesnav h2{flex:1;text-align:center;font-size:clamp(19px,5.6vw,24px);font-weight:800;letter-spacing:-.02em}
.mesnav h2 small{display:block;font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border-radius:22px;padding:14px 13px 15px;box-shadow:var(--shadow);min-width:0;display:grid;gap:6px;text-align:left}
.kpi span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font-size:clamp(15px,4.8vw,21px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi.dark{background:var(--inv-bg)} .kpi.dark span{color:var(--inv-mute)} .kpi.dark b{color:var(--inv-ink)}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px 3px 8px;margin:-3px -3px -8px}
.fchips::-webkit-scrollbar{display:none}
.fchip{position:relative;flex:none;display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:14.5px;color:var(--ink-2)}
.fchip.on{background:var(--accent-soft);color:var(--accent)}
.fchip select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:pointer}
.search input{width:100%;font:500 16px var(--f-body);padding:13px 20px;border-radius:999px;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent)}
.dgroup{display:grid;gap:8px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 8px 0;font-weight:600;color:var(--ink-2);font-size:14.5px}
.dayh b{font-variant-numeric:tabular-nums;font-weight:700}
.daycard{padding:8px 18px}
.daycard .rows>.row:first-child{padding-top:8px}
.daycard .rows>.row:last-child{padding-bottom:8px}

/* Patrimonio */
.pat{background:var(--pat);border-radius:30px;padding:20px 18px 14px;display:grid;gap:2px;text-align:center}
.pat-big{font-size:clamp(36px,11vw,48px);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.08;margin-top:8px}
.pat-chg{font-size:14.5px;color:var(--ink-2);margin-top:4px}
.pat-chg b{color:var(--pos)} .pat-chg b.neg{color:var(--neg)}
.ptip{font-size:13px;color:var(--ink-2);min-height:20px;margin-top:10px;font-variant-numeric:tabular-nums}
.pchart{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
.pchart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pchart .ln.f{stroke-dasharray:4 5;opacity:.85}
.pchart .ar{fill:var(--accent);opacity:.14}
.pchart .pt{fill:var(--accent);stroke:var(--pat);stroke-width:2}
.pchart .pt.f{fill:var(--pat);stroke:var(--accent);stroke-width:2}
.pchart .hv{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.pchart .hvl{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.pchart text{font:600 11px var(--f-body);fill:var(--ink-3)}

/* Análisis */
.mchips{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:2px 0;scroll-behavior:smooth}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:none;padding:8px 12px;font-size:17px;font-weight:600;color:var(--ink-3);border-radius:999px}
.mchips button[aria-pressed="true"]{color:var(--ink);font-weight:800}
.total{display:grid;gap:2px;padding:4px 6px 0}
.total b{font-size:clamp(34px,10vw,44px);font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1}
.total .muted{font-size:14px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--surface);border-radius:26px;padding:16px;box-shadow:var(--shadow);display:grid;gap:8px;align-content:start;min-width:0;text-align:left}
.mini-h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--ink-2)}
.mini .v{font-size:clamp(18px,5.4vw,22px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.mini .v.acc{color:var(--accent)}
.mini .s{font-size:12.5px;color:var(--ink-3)}
.spark{width:100%;height:46px;display:block}
.spark rect{fill:var(--accent-soft)} .spark rect.cur{fill:var(--accent)}
.ringw{display:flex;align-items:center;gap:10px}
.ring{width:54px;height:54px;flex:none}
.ring .t{fill:none;stroke:var(--surface-2);stroke-width:7}
.ring .v{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
.ring .v.neg{stroke:var(--neg)}

/* Lecturas */
.reads{display:grid;gap:12px}
.read{display:flex;gap:12px;align-items:flex-start}
.read p{font-size:14.5px;min-width:0}
.read-ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface-2);color:var(--ink-2)}
.read.alerta .read-ic{background:var(--warn-soft);color:var(--warn)}
.read.aviso .read-ic{background:var(--gold-soft);color:var(--gold)}
.read.ok .read-ic{background:var(--accent-soft);color:var(--accent)}

/* Piezas que usan las hojas y vistas secundarias */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border-radius:22px;padding:14px 14px 16px;display:grid;gap:4px;align-content:start;min-width:0;box-shadow:var(--shadow)}
.t-k{font-size:13px;color:var(--ink-2);font-weight:600}
.t-v{font-weight:800;font-size:clamp(20px,6vw,25px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.15}
.t-v.neg{color:var(--neg)} .t-v.pos{color:var(--pos)}
.t-s{font-size:12.5px;color:var(--ink-3)}
.cats{display:grid;gap:15px}
.cat-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cat-name{font-weight:600;min-width:0}
.cat-amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.cat-amt small{color:var(--ink-3);font-weight:500;font-size:13px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.bar.over i{background:var(--neg)} .bar.tight i{background:var(--gold)} .bar.goal i{background:var(--ink-2)}
.cat-note{font-size:13px;color:var(--neg);margin-top:5px}

.form input:where(:not([type=checkbox]):not([type=radio])),.form select{width:100%;min-width:0;font:500 16px var(--f-body);padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);appearance:none;-webkit-appearance:none}
.form select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.form input:focus,.form select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}

.actions.one{grid-template-columns:1fr}
.calc{background:var(--surface-2);border-radius:18px;padding:14px 16px;display:grid;gap:10px;font-size:14px}

.step{display:grid;gap:12px;padding:16px 0;border-top:1px solid var(--line)}

.srow{display:grid;grid-template-columns:minmax(0,1fr) 100px 38px;gap:8px;align-items:center}
.srow .amount{grid-column:2/4}
.form .srow select{font-size:15px;padding-left:11px;padding-right:28px;background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%}
.srow .n{grid-column:1/3}

.frow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.7fr) auto;gap:8px;align-items:center}
.frow.ap select{grid-column:1/-1}
.frow.ap+.frow.ap{padding-top:10px;border-top:1px dashed var(--line)}
.tipos li{font-size:13.5px;color:var(--ink-2)}
.tipos b{color:var(--ink)}

/* Pantalla de bloqueo con código */
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:auto;background:linear-gradient(155deg,var(--hero-1) 0%,var(--hero-2) 100%);color:var(--hero-ink);padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
.lock-in{width:100%;max-width:320px;display:grid;justify-items:center;text-align:center}
.lock-ic{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.lock-t{font-weight:800;font-size:22px;letter-spacing:-.02em;margin-top:16px}
.lock-s{color:var(--hero-mute);font-size:15px;margin-top:4px;min-height:22px}
.lock-s.err{color:var(--hero-warn);font-weight:600}
.lock-dots{display:flex;gap:16px;margin:28px 0 36px}

.lock-dots.err i{background:var(--hero-warn);box-shadow:none}
.lock-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lock-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px}

.lock-pad button:disabled{opacity:.35}

@media (max-height:640px){ .lock-pad{gap:10px 22px} .lock-pad button{width:66px;height:66px;font-size:26px} .lock-dots{margin:20px 0 24px} }

/* Aviso flotante */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--inv-bg);color:var(--inv-ink);border-radius:18px;padding:11px 12px 11px 16px;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--lift);font-size:14px;font-weight:600}
.toast button{color:var(--inv-ink);font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:4px 6px}
@media (prefers-reduced-motion: reduce){ .lock-dots.shake{animation:none} .sheet{animation:none} details.card>summary .chev{transition:none} .mchips{scroll-behavior:auto} }
@media (max-width:360px){ .tiles,.grid4{gap:10px} .tile,.mini{padding:12px} .grid2{grid-template-columns:1fr} .kpis{gap:8px} .kpi{padding:12px 10px} }
</style>
</head>

<script id="core">
'use strict';
/* ===== Núcleo: fechas, euros y cálculos (sin DOM) ===== */
const pad = n => String(n).padStart(2,'0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const hoyISO = () => toISO(new Date());
const ymOf = s => String(s).slice(0,7);
const addDays = (s,n) => { const d = fromISO(s); d.setDate(d.getDate()+n); return toISO(d); };
const addMonths = (ym,n) => { const [y,m] = ym.split('-').map(Number); const t = y*12 + (m-1) + n; return `${Math.floor(t/12)}-${pad(t%12+1)}`; };
const diasMes = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const diffDays = (a,b) => Math.round((fromISO(b) - fromISO(a))/864e5);
const monthsBetween = (a,b) => { const [y1,m1] = a.split('-').map(Number), [y2,m2] = b.split('-').map(Number); return (y2-y1)*12 + (m2-m1); };
const r2 = n => Math.round((Number(n)||0)*100 + (n>=0?1e-7:-1e-7))/100;

function parseImporte(str){
  if (str == null) return NaN;
  let s = String(str).trim().replace(/\s|€/g,'').replace(/eur(os)?$/i,'');
  if (!s) return NaN;
  const neg = s.startsWith('-'); s = s.replace(/^[-+]/,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  if (!/^\d*\.?\d+$/.test(s)) return NaN;
  const n = Number(s);
  return isFinite(n) ? (neg ? -n : n) : NaN;
}
const NF2 = new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true});
const NF0 = new Intl.NumberFormat('es-ES',{maximumFractionDigits:0,useGrouping:true});
function eur(n, o={}){
  const dec = o.dec ?? 2; let v = Number(n)||0;
  if (Math.abs(v) < (dec ? 0.005 : 0.5)) v = 0;
  return (v<0 ? '−' : (o.signo && v>0 ? '+' : '')) + (dec ? NF2 : NF0).format(Math.abs(v)) + ' €';
}
function kfmt(v){ const a = Math.abs(v); const s = a>=1000 ? (a/1000).toFixed(a>=10000?0:1).replace('.',',')+'k' : String(Math.round(a)); return (v<0 && Math.round(a)>0 ? '−' : '') + s; }
const fmtIn = n => { const v = Number(n); if (!isFinite(v)) return ''; return v.toFixed(2).replace('.',',').replace(/,00$/,''); };

const esAhorro = c => !!c && (c.tipo==='inversion' || c.tipo==='ahorro');
const mesDe = m => m.mes || ymOf(m.fecha);
const recActiva = (rc, ym) => rc.activo !== false && (!rc.inicio || rc.inicio <= ym) && (!rc.fin || rc.fin >= ym);
const planEnMes = (p, ym) => { const k = monthsBetween(p.mes, ym); return k >= 0 && k < (Number(p.cuotas)||1); };
const fechaPago = (ym, dia) => `${ym}-${pad(Math.min(Math.max(Number(dia)||1,1), diasMes(ym)))}`;

/* Inicio de la semana del sobre: el último día de recarga (0=domingo … 6=sábado) que no sea posterior a la fecha */
function weekStart(fecha, dia){ const d = fromISO(fecha); const back = (d.getDay() - dia + 7) % 7; d.setDate(d.getDate()-back); return toISO(d); }
/* Recargas con día de semana `dia` en el intervalo (desdeExcl, hastaIncl] */
function recargasEntre(desdeExcl, hastaIncl, dia){
  if (hastaIncl <= desdeExcl) return 0;
  let first = addDays(desdeExcl, 1);
  first = addDays(first, (dia - fromISO(first).getDay() + 7) % 7);
  if (first > hastaIncl) return 0;
  return Math.floor(diffDays(first, hastaIncl)/7) + 1;
}
const recargasEnMes = (ym, dia) => recargasEntre(addDays(ym+'-01', -1), `${ym}-${pad(diasMes(ym))}`, dia);

/* Saldo de una cuenta = saldo base + movimientos posteriores + recargas automáticas del sobre */
function saldoCuenta(c, movs, sobre, hoy){
  if (!c) return 0;
  let s = Number(c.saldoBase)||0; const fb = c.fechaBase || '0000-00-00', ts = c.baseTs || '';
  for (const m of movs){
    if (m.fecha > hoy) continue;
    if (!(m.fecha > fb || (m.fecha === fb && (m.creado||'') > ts))) continue;
    if (m.tipo==='gasto' && m.cuenta===c.id) s -= m.importe;
    else if (m.tipo==='ingreso' && m.cuenta===c.id) s += m.importe;
    else if (m.tipo==='traspaso'){ if (m.desde===c.id) s -= m.importe; if (m.hacia===c.id) s += m.importe; }
  }
  if (sobre && sobre.importe > 0 && (c.id===sobre.cuenta || c.id===sobre.origen) && sobre.cuenta !== sobre.origen){
    const n = recargasEntre(fb, hoy, sobre.dia);
    if (c.id===sobre.cuenta) s += n*sobre.importe; else s -= n*sobre.importe;
  }
  return r2(s);
}

function estadoSobre(sobre, movs, hoy){
  const ini = weekStart(hoy, sobre.dia), fin = addDays(ini, 6), prox = addDays(ini, 7);
  let gastado = 0, extra = 0, entradas = 0;
  for (const m of movs){
    if (m.fecha < ini || m.fecha > fin || m.stby) continue;
    if (m.tipo==='gasto' && m.cuenta===sobre.cuenta) gastado += m.importe;
    else if (m.tipo==='ingreso' && m.cuenta===sobre.cuenta) entradas += m.importe;
    else if (m.tipo==='traspaso'){ if (m.hacia===sobre.cuenta) extra += m.importe; if (m.desde===sobre.cuenta) extra -= m.importe; }
  }
  const disponible = r2(sobre.importe + extra + entradas), queda = r2(disponible - gastado), diasRest = diffDays(hoy, prox);
  return {ini, fin, prox, gastado:r2(gastado), extra:r2(extra), entradas:r2(entradas), disponible, queda, diasRest, porDia: diasRest>0 ? r2(Math.max(queda,0)/diasRest) : 0};
}

function resumenMes(ym, movs, cuentas){
  const R = {ing:0, gas:0, sacado:0, aportado:0, amortizado:0, porCat:{}, sacadoDe:{}};
  for (const m of movs){
    if (mesDe(m) !== ym) continue; const v = m.importe;
    if (m.tipo==='gasto'){ R.gas += v; const k = m.cat || '_'; R.porCat[k] = (R.porCat[k]||0) + v; }
    else if (m.tipo==='ingreso') R.ing += v;
    else if (m.tipo==='traspaso'){
      if (String(m.hacia||'').startsWith('deuda:')){ R.amortizado += v; continue; }
      const d = cuentas[m.desde], h = cuentas[m.hacia];
      if (esAhorro(d) && !esAhorro(h)){ R.sacado += v; const n = d.nombre; R.sacadoDe[n] = (R.sacadoDe[n]||0) + v; }
      else if (!esAhorro(d) && esAhorro(h)) R.aportado += v;
    }
  }
  for (const k of ['ing','gas','sacado','aportado','amortizado']) R[k] = r2(R[k]);
  R.neto = r2(R.ing - R.gas);
  return R;
}

/* Préstamo (sistema francés, interés mensual = TIN/12) */
function simular(C, r, cuota){
  if (C <= 0.005) return {n:0, intereses:0, ultima:0};
  if (cuota <= C*r + 1e-9) return {n:Infinity, intereses:Infinity, ultima:cuota};
  let n = 0, int = 0, ultima = cuota;
  while (C > 0.005 && n < 1200){ const i = C*r; int += i; n++; if (C + i <= cuota + 0.005){ ultima = C + i; C = 0; break; } C = C + i - cuota; }
  return {n, intereses:r2(int), ultima:r2(ultima)};
}
function estadoDeuda(d, movs, hoy){
  const r = (Number(d.tin)||0)/100/12; let C = Number(d.capital)||0; const f = d.fechaCapital || hoy; const ev = [];
  let ym = ymOf(f);
  for (let k = 0; k < 1200; k++){ const fp = fechaPago(ym, d.dia); if (fp > hoy) break; if (fp > f) ev.push({fecha:fp, t:'pago'}); ym = addMonths(ym, 1); }
  for (const m of movs) if (m.tipo==='traspaso' && m.hacia==='deuda:'+d.id && m.fecha > f && m.fecha <= hoy) ev.push({fecha:m.fecha, t:'extra', imp:m.importe});
  ev.sort((a,b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.t==='pago' ? -1 : 1));
  for (const e of ev){ if (C <= 0) break; if (e.t==='pago') C = Math.max(C + C*r - d.cuota, 0); else C = Math.max(C - e.imp, 0); }
  C = r2(C);
  const sim = simular(C, r, Number(d.cuota)||0);
  let nym = ymOf(hoy), prox = fechaPago(nym, d.dia); if (prox <= hoy){ nym = addMonths(nym, 1); prox = fechaPago(nym, d.dia); }
  const finYm = sim.n > 0 && isFinite(sim.n) ? addMonths(nym, sim.n - 1) : null;
  return {pendiente:C, r, cuotasRest:sim.n, intereses:sim.intereses, ultima:sim.ultima, prox, proxYm:nym, finYm};
}
function simularAmortizacion(C, r, cuota, X, comPct){
  const base = simular(C, r, cuota), C2 = Math.max(C - X, 0), com = r2(Math.min(X, C)*(comPct||0)/100);
  const plazo = simular(C2, r, cuota);
  const n = base.n; let cuotaN = 0;
  if (isFinite(n) && n > 0 && C2 > 0) cuotaN = r > 0 ? C2*r/(1 - Math.pow(1+r, -n)) : C2/n;
  const red = cuotaN > 0 ? simular(C2, r, cuotaN + 1e-6) : {n:0, intereses:0};
  return {base, com, cancela: C2 <= 0.005,
    plazo:{n:plazo.n, menos:base.n - plazo.n, ahorro:r2(base.intereses - plazo.intereses - com)},
    cuota:{nueva:r2(cuotaN), menos:r2(cuota - cuotaN), ahorro:r2(base.intereses - red.intereses - com)}};
}

/* Lo previsto para un mes: fijos + pagas extra + sobre (recargas reales del mes) + planificados. f = factor IPC */
function habitualMes(ym, ctx, f = 1){
  const {recs, plans, cfg} = ctx, est = ctx.estVar || {}, huchas = ctx.huchas; let ing = 0, gFijo = 0, gVar = 0;
  for (const rc of recs){ if (!recActiva(rc, ym)) continue;
    if (rc.tipo==='ingreso') ing += (rc.variable && est[rc.id] != null) ? est[rc.id] : rc.importe;
    else if (rc.tipo==='gasto'){
      if (rc.deuda){ const df = ctx.deudas && ctx.deudas[rc.deuda];
        gFijo += !df ? rc.importe : (df.pagado || (df.fin && ym > df.fin)) ? 0 : (ym === df.fin ? df.ultima : rc.importe); }
      else gVar += rc.importe; }
    else if (rc.tipo==='traspaso' && huchas && huchas.has(rc.hacia)) gFijo += rc.importe; }
  const mes = Number(ym.slice(5)), su = cfg.sueldo || {};
  const extra = (Number(su.pagas)===14 && (su.meses||[6,12]).includes(mes)) ? (Number(su.extra)||0) : 0;
  const sb = cfg.sobre || {}; const sobre = sb.importe > 0 ? sb.importe * recargasEnMes(ym, Number(sb.dia)||0) : 0;
  let plIng = 0, plGas = 0;
  for (const p of plans){ if (!planEnMes(p, ym)) continue; if (p.tipo==='ingreso') plIng += p.importe; else plGas += p.importe; }
  const gas = gFijo + (gVar + sobre)*f;
  return {ing:r2(ing+extra), extra:r2(extra), sobre:r2(sobre*f), gas:r2(gas), plIng:r2(plIng), plGas:r2(plGas), neto:r2(ing + extra + plIng - gas - plGas)};
}
/* Valor de unas cuotas en euros de hoy, descontando la inflación mensual im */
function valorHoy(p, im, cur){ let v = 0; for (let j = 0; j < (Number(p.cuotas)||1); j++){ const k = Math.max(monthsBetween(cur, addMonths(p.mes, j)), 0); v += p.importe/Math.pow(1+im, k); } return r2(v); }

/* «super 45», «cena 32,50 ayer», «+stby 60» */
function parseRapido(txt, cats, hoy){
  let t = String(txt||'').trim(); if (!t) return null;
  let tipo = 'gasto'; if (t.startsWith('+')){ tipo = 'ingreso'; t = t.slice(1).trim(); }
  let fecha = hoy;
  if (/(^|\s)anteayer(\s|$)/i.test(t)){ fecha = addDays(hoy,-2); t = t.replace(/(^|\s)anteayer(?=\s|$)/i,' '); }
  else if (/(^|\s)ayer(\s|$)/i.test(t)){ fecha = addDays(hoy,-1); t = t.replace(/(^|\s)ayer(?=\s|$)/i,' '); }
  const mm = t.match(/(^|\s)(-?\d[\d.,]*)\s*(€|eur(?:os)?)?(?=\s|$)/i);
  let importe = NaN;
  if (mm){ importe = parseImporte(mm[2]); t = t.slice(0, mm.index) + ' ' + t.slice(mm.index + mm[0].length); }
  const det = t.replace(/\s+/g,' ').trim(), low = det.toLowerCase();
  const words = low.split(/[^\p{L}\p{N}-]+/u).filter(Boolean);
  const STOP = new Set(['comer','fuera','cuidado','personal','otros','casa','facturas','deporte']);
  let best = null, bestScore = 0;
  for (const c of cats){
    if (c.tipo !== tipo || c.oculta) continue;
    const keys = [...(c.palabras||[]), ...c.nombre.toLowerCase().split(/\s+/).filter(w => w.length > 3 && !STOP.has(w))];
    let sc = 0;
    for (const k of keys){ if (!k) continue; const hit = k.includes(' ') ? low.includes(k) : words.some(w => w===k || (k.length>=4 && w.startsWith(k)) || (w.length>=4 && k.startsWith(w))); if (hit) sc++; }
    if (sc > bestScore){ best = c; bestScore = sc; }
  }
  return {tipo, importe: isFinite(importe) ? Math.abs(importe) : NaN, cat: best ? best.id : null, detalle: det ? det.charAt(0).toUpperCase() + det.slice(1) : '', fecha};
}

/* ===== Datos ===== */
function normDoc(col, id, d){
  const o = {...(d||{}), id};
  if ('importe' in o) o.importe = Number(o.importe)||0;
  if (col==='cuentas') o.saldoBase = Number(o.saldoBase)||0;
  if (col==='deudas') for (const k of ['capital','cuota','tin','dia','original','comision']) o[k] = Number(o[k])||0;
  if (col==='obj'){ o.meta = Number(o.meta)||0; o.manual = Number(o.manual)||0; }
  if (col==='rec') o.dia = Number(o.dia)||1;
  if (col==='plan') o.cuotas = Number(o.cuotas)||1;
  if (col==='stby'){ o.coste = Number(o.coste)||0; o.cobrar = Number(o.cobrar)||0; o.cobrado = !!o.cobrado; o.persona = String(o.persona || ''); if (!o.fecha) o.fecha = hoyISO(); }
  if (col==='mov' && !o.fecha) o.fecha = hoyISO();
  return o;
}
function normCfg(d){
  const c = JSON.parse(JSON.stringify(d||{}));
  c.categorias = Array.isArray(c.categorias) && c.categorias.length ? c.categorias.map(x => ({...x, presupuesto:Number(x.presupuesto)||0, palabras:Array.isArray(x.palabras) ? x.palabras : []})) : CATS_DEF.map(x => ({...x, presupuesto:0}));
  c.sobre = {importe:0, dia:1, cuenta:'', origen:'', ...(c.sobre||{})}; c.sobre.importe = Number(c.sobre.importe)||0; c.sobre.dia = Number(c.sobre.dia); if (!(c.sobre.dia >= 0 && c.sobre.dia <= 6)) c.sobre.dia = 1;
  c.sueldo = {pagas:12, extra:0, meses:[6,12], ...(c.sueldo||{})};
  if (c.ipc == null) c.ipc = IPC_DEF;
  c.nombre = c.nombre || 'Jordi';
  return c;
}
/* Fuera de claude.ai todo se guarda en este dispositivo: una clave de localStorage por documento (cj:mov/<id>…) */
const LS = 'cj:';
const local = {
  disponible(){ try { localStorage.setItem(LS + 'prueba', '1'); localStorage.removeItem(LS + 'prueba'); return true; } catch { return false; } },
  leer(k, def = null){ try { const v = localStorage.getItem(LS + k); return v == null ? def : JSON.parse(v); } catch { return def; } },
  escribir(k, v){ try { if (v == null) localStorage.removeItem(LS + k); else localStorage.setItem(LS + k, JSON.stringify(v)); } catch(e){ console.warn(e); const err = new Error('Sin espacio'); err.code = 'quota_exceeded'; throw err; } },
  docs(){ const o = {}; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i) || ''; if (!k.startsWith(LS)) continue; const r = k.slice(LS.length), j = r.indexOf('/'); if (j > 0 && COLS[r.slice(0, j)]) (o[r.slice(0, j)] ||= []).push(r); } return o; },
};
const enLocal = (k, v) => { if (S.mode === 'local'){ local.escribir(k, v); programarSync(); } };
function cargarLocal(){
  const c = local.leer('cfg'); S.cfg = c ? normCfg(c) : null;
  const ks = local.docs();
  for (const [col, key] of Object.entries(COLS)) S[key] = (ks[col] || []).map(k => local.leer(k)).filter(d => d && d.id).map(d => normDoc(col, d.id, d));
  S.meta = local.leer('meta'); S.copia = local.leer('copia'); S.sync = local.leer('sync');
}
const store = {
  async set(col, id, data){ if (CAPS.db) return CAPS.db.collection(col).doc(id).set(data); const k = COLS[col], doc = normDoc(col, id, data); enLocal(`${col}/${id}`, doc); S[k] = S[k].filter(x => x.id !== id).concat(doc); after(); },
  async del(col, id){ if (CAPS.db) return CAPS.db.collection(col).doc(id).delete(); const k = COLS[col]; enLocal(`${col}/${id}`, null); S[k] = S[k].filter(x => x.id !== id); after(); },
  async setCfg(data){ if (CAPS.db) return CAPS.db.doc('cfg/main').set(data); const c = normCfg(data); enLocal('cfg', c); S.cfg = c; after(); },
  async delCfg(){ if (CAPS.db) return CAPS.db.doc('cfg/main').delete(); enLocal('cfg', null); S.cfg = null; after(); },

const ordenMovs = (a,b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : ((b.creado||'') > (a.creado||'') ? 1 : (b.creado||'') < (a.creado||'') ? -1 : 0);
function after(){
  S.movs.sort(ordenMovs);

function subscribe(){
  const db = CAPS.db;
  const onErr = e => { console.warn(e); if (e?.code === 'revoked'){ S.mode = 'sin-acceso'; schedule(); } };
  db.doc('cfg/main').onSnapshot(s => { S.cfg = s.exists ? normCfg(s.data()) : null; S.loaded.cfg = true; if (!s.metadata?.fromCache) S.def.cfg = true; after(); }, onErr);

/* Los fijos se anotan solos el día que toca (hasta 2 meses hacia atrás), con id fijo para no duplicar */
async function generarRecurrentes(){
  if (!S.cfg || S.reseteando) return;
  if (S.generando){ S.genOtra = true; return; }
  S.generando = true;
  try {
    const hoy = hoyISO(), cur = ymOf(hoy), min = addMonths(cur, -2);
    for (const rc of [...S.recs]){
      if (rc.activo === false || rc.variable || !(rc.importe > 0)) continue;
      for (let ym = rc.inicio && rc.inicio > min ? rc.inicio : min; ym <= cur; ym = addMonths(ym, 1)){
        if (!recActiva(rc, ym) || (rc.omitidos||[]).includes(ym)) continue;
        const fecha = fechaPago(ym, rc.dia); if (fecha > hoy) continue;
        const id = `r-${rc.id}-${ym}`;
        if (S.movs.some(m => m.id === id)) continue;
        if (CAPS.db){ const snap = await CAPS.db.collection('mov').doc(id).get(); if (snap.exists) continue; }
        let importe = rc.importe;
        if (rc.deuda){ const d = S.deudas.find(x => x.id === rc.deuda); if (d){ const e = estadoDeuda(d, S.movs, addDays(fecha, -1)); if (!(e.pendiente > 0.005)) continue; importe = r2(Math.min(d.cuota, e.pendiente*(1 + e.r))); } }
        await store.set('mov', id, {fecha, tipo:rc.tipo, importe, cat:rc.cat||null, cuenta:rc.cuenta||null, desde:rc.desde||null, hacia:rc.hacia||null, detalle:rc.detalle||'', rec:rc.id, creado:new Date().toISOString()});
      }
    }
  } catch(e){ console.warn(e); }
  finally { S.generando = false; if (S.genOtra){ S.genOtra = false; setTimeout(generarRecurrentes, 200); } }
}

function movRow(m, o = {}){

    sub = (sac ? 'De ahorros · ' : '') + `${ctaNombre(m.desde)} → ${ctaNombre(m.hacia)}`;
    icon = `<span class="ico ${sac ? 'al' : 'tr'}">${ic('arrows')}</span>`; amt = eur(m.importe); if (sac) cls = 'neg';
  } else {

    sub = catNombre(m.cat) + (o.fecha ? '' : (m.cuenta ? ' · ' + ctaNombre(m.cuenta) : ''));

}

/* Lo que falta por pagar en el mes (fijos que aún no han pasado y recargas del sobre) */
function porPagar(ym, hoy){
  const items = [];
  if (!S.cfg || ymOf(hoy) > ym) return {items, total:0};
  const dc = deudasCtx(), fin = `${ym}-${pad(diasMes(ym))}`;
  for (const rc of S.recs){
    if (rc.tipo !== 'gasto' || rc.activo === false || !recActiva(rc, ym) || (rc.omitidos||[]).includes(ym)) continue;
    const f = fechaPago(ym, rc.dia); if (f <= hoy || S.movs.some(m => m.id === `r-${rc.id}-${ym}`)) continue;
    let imp = rc.importe;
    if (rc.deuda){ const df = dc[rc.deuda]; if (df && (df.pagado || (df.fin && ym > df.fin))) continue; if (df && ym === df.fin) imp = df.ultima; }
    items.push({fecha:f, nombre:rc.detalle || catNombre(rc.cat), importe:imp, cat:rc.cat, tipo:'gasto'});
  }
  const sb = S.cfg.sobre;
  if (sb.importe > 0 && sb.cuenta){ for (let d = addDays(hoy, 1); d <= fin; d = addDays(d, 1)) if (fromISO(d).getDay() === sb.dia) items.push({fecha:d, nombre:'Recarga del sobre', importe:sb.importe, tipo:'gasto', sobre:true}); }
  items.sort((a,b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  return {items, total:r2(items.reduce((a,x) => a + x.importe, 0))};
}
/* Fecha en que se espera un ingreso variable (la nómina) */
function esperada(rc, hoy){
  let ult = null; for (const m of S.movs) if (m.tipo === 'ingreso' && m.cat === rc.cat && (!ult || m.fecha > ult.fecha)) ult = m;
  let ym = ult ? ymOf(ult.fecha) : (rc.inicio || ymOf(hoy)), exp = fechaPago(ym, rc.dia);
  if (ult){ const min = addDays(ult.fecha, 20); for (let g = 0; g < 3 && exp < min; g++){ ym = addMonths(ym, 1); exp = fechaPago(ym, rc.dia); } }
  return {exp, ult};
}
function nominaPendiente(rc, hoy){ const p = esperada(rc, hoy); return addDays(p.exp, -4) <= hoy ? p : null; }
/* Próximos cobros y pagos fijos */
function proximos(hoy, dias = 35){
  const fin = addDays(hoy, dias), out = [], dc = deudasCtx(), cur = ymOf(hoy);
  for (const rc of S.recs){
    if (rc.activo === false || rc.tipo === 'traspaso') continue;
    if (rc.variable){ const p = esperada(rc, hoy); if (p.exp <= fin) out.push({fecha:p.exp, nombre:rc.detalle || catNombre(rc.cat), importe:rc.importe, cat:rc.cat, tipo:rc.tipo, aprox:true, tarde:p.exp < hoy}); continue; }
    for (let k = 0; k < 3; k++){
      const ym = addMonths(cur, k); if (!recActiva(rc, ym) || (rc.omitidos||[]).includes(ym)) continue;
      const f = fechaPago(ym, rc.dia); if (f <= hoy || f > fin || S.movs.some(m => m.id === `r-${rc.id}-${ym}`)) continue;
      let imp = rc.importe;
      if (rc.deuda){ const df = dc[rc.deuda]; if (df && (df.pagado || (df.fin && ym > df.fin))) continue; if (df && ym === df.fin) imp = df.ultima; }
      out.push({fecha:f, nombre:rc.detalle || catNombre(rc.cat), importe:imp, cat:rc.cat, tipo:rc.tipo});
    }
  }
  return out.sort((a,b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
}

function timeline(n, idx, a, z, h){
  let dots = ''; for (let i = 0; i < n; i++) dots += `<i class="${i < idx ? 'on' : i === idx ? 'today' : ''}"></i>`;
  const pct = ((idx + .5)/n)*100, pos = pct < 14 ? 'style="left:0"' : pct > 86 ? 'style="right:0"' : `class="hoy mid" style="left:${pct.toFixed(1)}%"`;
  const hoyEl = pct < 14 || pct > 86 ? `<span class="hoy" ${pos}>${h}</span>` : `<span ${pos}>${h}</span>`;
  return `<div class="tl" aria-hidden="true"><div class="tl-dots" style="--tlgap:${n > 15 ? 3 : 6}px">${dots}</div><div class="tl-lbl">${pct >= 30 ? `<span style="left:0">${a}</span>` : ''}${hoyEl}${pct <= 70 ? `<span style="right:0">${z}</span>` : ''}</div></div>`;
}
function vHero(hoy){

      ${timeline(7, idx, fechaCorta(e.ini).replace(/ \w+$/, ''), fechaCorta(e.fin).replace(/ \w+$/, ''), `Hoy · ${DIAS_C[fromISO(hoy).getDay()]}`)}
      <div class="hero-foot"><span>Sobre<b>${eur(e.disponible)}</b></span><span>Gastado<b>${eur(-e.gastado)}</b></span></div>

  const tq = r2(r.ing - r.gas), pp = porPagar(ym, hoy), eS = haySobre ? estadoSobre(sb, S.movs, hoy) : null, libre = r2(tq - pp.total - (eS ? Math.max(eS.queda, 0) : 0));
  const mc = MESES_C[Number(ym.slice(5)) - 1];
  return `<section class="hero ${tq < 0 ? 'is-over' : ''}" aria-label="Este mes">
    <div class="hero-top">${seg}<p class="hero-r">${dRest === 0 ? 'Último día' : dRest === 1 ? 'Queda 1 día' : `Quedan ${dRest} días`}</p></div>
    <p class="hero-k">Te queda este mes</p>
    <p class="hero-big">${eur(tq)}</p>
    ${pp.total > 0 || eS ? `<p class="hero-sub">Cuando pagues los fijos y sobres que faltan, te quedarán unos ${eur(libre, {dec:0})}</p>` : ''}
    ${timeline(diasMes(ym), dia - 1, `1 ${mc}`, `${diasMes(ym)} ${mc}`, `Hoy · ${dia}`)}
    <div class="hero-foot"><span>Ingresos<b class="p">${eur(r.ing, {signo:true})}</b></span><span>Gastos<b>${eur(-r.gas)}</b></span></div>

function heroExtra(sb, e){
  const cm = ctasMap(); let ah = 0, otro = 0;
  for (const m of S.movs){ if (m.tipo !== 'traspaso' || m.hacia !== sb.cuenta || m.fecha < e.ini || m.fecha > e.fin) continue; if (esAhorro(cm[m.desde])) ah += m.importe; else otro += m.importe; }

   + `<div class="mesnav"><button class="rbtn" data-act="mes" data-d="-1" aria-label="Mes anterior" ${ym <= min ? 'disabled' : ''}>${ic('left')}</button><h2>${cap(mesAnyo(ym))}${ym === cur ? '<small>En curso</small>' : ''}</h2><button class="rbtn" data-act="mes" data-d="1" aria-label="Mes siguiente" ${ym >= cur ? 'disabled' : ''}>${ic('right')}</button></div>

   ${r.sacado > 0 ? `<p class="banner" style="background:var(--warn-soft)">En ${mesNombre(ym)} has sacado <b>${eur(r.sacado)}</b> de tus ahorros.</p>` : ''}

  for (const d of S.deudas) if (!d.fechaCapital || d.fechaCapital <= f) v -= estadoDeuda(d, S.movs, f).pendiente;
  for (const t of S.stby) if (t.fecha <= f && !(t.cobrado && t.fechaCobro && t.fechaCobro <= f)) v += t.cobrar;

/* Lo que aún va a entrar y salir en lo que queda del mes en curso (desde hoy) */

function patSerie(neto){

function lecturas(ym, cur, hoy){

    else if (e.disponible > 0 && e.gastado/e.disponible > .8 && e.diasRest > 2) add('aviso', `Llevas el ${pct(e.gastado/e.disponible)} del sobre y quedan ${e.diasRest} días: ${eur(e.porDia)} al día.`);
  }

  if (r.sacado > 0) add('alerta', `En ${mesNombre(ym)} has sacado <b>${eur(r.sacado)}</b> de ahorros (${esc(Object.entries(r.sacadoDe).map(([n,v]) => `${n}: ${eur(v,{dec:0})}`).join(', '))}).`);

    else add('ok', `Vas a ritmo: ${pct(pg)} del gasto previsto con el mes al ${pct(pm)}.`);
  }
  const pmc = porMesCat(), first = primerMes() || ym; let n = 0;
  for (const c of S.cfg.categorias){ if (c.tipo !== 'gasto' || !(c.presupuesto > 0)) continue; const g = r.porCat[c.id]||0; if (g <= c.presupuesto + .005) continue;
    let racha = 0, m = ym; while (m >= first && racha < 24){ if (((pmc[m]||{})[c.id]||0) > c.presupuesto + .005) racha++; else break; m = addMonths(m,-1); }
    if (n++ < 3) add('aviso', `<b>${esc(c.nombre)}</b> se pasa del presupuesto${racha > 1 ? ` (${racha} meses seguidos). Revisa si el presupuesto es realista o si toca recortar` : ''}: ${eur(g,{dec:0})} de ${eur(c.presupuesto,{dec:0})}.`); }
  if (ym === cur){

        add('aviso', `${cap(mesNombre(nx))} sale en ${eur(hn.neto, {dec:0})} porque tiene cinco ${diaPl(sb.dia)}: recargas el sobre cinco veces (${eur(sb.importe*5, {dec:0})} en vez de ${eur(sb.importe*4, {dec:0})}). Es normal: se compensa con los meses de cuatro${h2.neto > 0 ? `, como ${mesNombre(n2)} (${eur(h2.neto, {dec:0, signo:true})})` : ''}.`); }
      else add('alerta', `${cap(mesNombre(nx))} sale en negativo con lo previsto: ${eur(hn.neto)}. Mira Análisis → Futuro para ver qué lo causa.`);
    }
    const f = fijosMes(cur); if (sb.importe > 0 && f.ing > 0 && sb.importe > f.semanal + .5) add('alerta', `Tu sobre de ${eur(sb.importe,{dec:0})} no cabe en tus fijos: el máximo que te deja tu nómina es ${eur(f.semanal)} a la semana.`);
    for (const d of S.deudas){ const e = estadoDeuda(d, S.movs, hoy); if (e.pendiente > 0 && isFinite(e.cuotasRest)) add('info', `${esc(d.nombre)}: quedan ${e.cuotasRest} cuotas y ${eur(e.pendiente,{dec:0})}. Terminas en ${mesAnyo(e.finYm)}.`); }
    const viejos = S.stby.filter(t => !t.cobrado && diffDays(t.fecha, hoy) > 30); if (viejos.length) add('aviso', `Tienes ${viejos.length} ${viejos.length === 1 ? 'billete' : 'billetes'} de STBY sin cobrar desde hace más de un mes: <b>${eur(viejos.reduce((a,t) => a + t.cobrar, 0))}</b>. Toca reclamarlos.`);

function catRows(r, ym, tipo){

    return `<div class="row grp">${icoCat(x.id === '_' ? null : x.id, tipo === 'ingreso' ? 'in' : '')}<span class="r-main"><span class="grp-top"><span class="r-t">${esc(x.nombre)}</span><span class="r-v">${eur(x.v)}${x.p > 0 ? `<small>de ${eur(x.p, {dec:0})}</small>` : ''}</span></span><span class="gbar ${over ? 'over' : x.p > 0 && ratio > .85 ? 'tight' : ''}"><i style="width:${(Math.min(ratio, 1)*100).toFixed(1)}%"></i></span>${over ? `<span class="cat-note" style="margin:0">Te has pasado ${eur(x.v - x.p, {dec:0})}${racha > 1 ? ` · ${racha} meses seguidos` : ''}</span>` : ''}</span></div>`;

/* ----- Futuro (proyección) ----- */
function proyeccion(conIpc){
  const hoy = hoyISO(), cur = ymOf(hoy), im = ipcMes(), rows = []; let acum = 0;
  for (let k = 0; k < 12; k++){
    const ym = addMonths(cur, k), h = habitualMes(ym, ctx(), conIpc ? Math.pow(1+im, k) : 1); let neto = h.neto, row = {ym, ...h};
    if (k === 0){ const r = resumenMes(cur, S.movs, ctasMap()); neto = r2(Math.max(r.ing, h.ing + h.plIng) - Math.max(r.gas, h.gas + h.plGas)); row.realI = r.ing; row.realG = r.gas; row.actual = true; }
    acum = r2(acum + neto); rows.push({...row, neto, acum});
  }
  const first = primerMes(), hist = [];
  for (let k = 5; k >= 1; k--){ const ym = addMonths(cur, -k); if (!first || ym < first) continue; const r = resumenMes(ym, S.movs, ctasMap()); hist.push({ym, neto:r.neto, ing:r.ing, gas:r.gas}); }
  return {rows, hist, im};
}
function chartSVG(bars){
  const W = 340, H = 196, pT = 20, pB = 24, pX = 4, n = bars.length, slot = (W - pX*2)/n, bw = Math.min(22, slot*.62);
  const max = Math.max(1, ...bars.map(b => b.v)), min = Math.min(0, ...bars.map(b => b.v)), span = max - min || 1, plotH = H - pT - pB - 14;
  const y = v => pT + (max - v)/span*plotH, y0 = y(0);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Ahorro neto por mes, real y previsto"><line x1="${pX}" x2="${W-pX}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" class="axis"/>`;
  bars.forEach((b, i) => {
    const cx = pX + slot*i + slot/2, yv = y(b.v), top = Math.min(yv, y0), h = Math.max(Math.abs(yv - y0), 1.5);
    s += `<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" class="${b.real ? 'b-real' : 'b-proj'}${b.v < 0 ? ' neg' : ''}"><title>${cap(mesAnyo(b.ym))}: ${eur(b.v, {dec:0})}</title></rect>`;
    s += `<text x="${cx.toFixed(1)}" y="${(b.v >= 0 ? top - 5 : top + h + 11).toFixed(1)}" class="lbl" text-anchor="middle">${kfmt(b.v)}</text>`;
    s += `<text x="${cx.toFixed(1)}" y="${H-6}" class="mlbl${b.cur ? ' cur' : ''}" text-anchor="middle">${MESES_C[Number(b.ym.slice(5))-1]}</text>`;
  });
  const iP = bars.findIndex(b => !b.real); if (iP > 0){ const x = (pX + slot*iP).toFixed(1); s += `<line x1="${x}" x2="${x}" y1="${pT-12}" y2="${H-pB}" class="divider"/>`; }
  return s + '</svg>';
}
function vFuturo(){

/* ----- STBY ----- */
const stbyPend = () => S.stby.filter(t => !t.cobrado);
const stbyNomina = ym => { const v = S.stby.reduce((a,t) => a + (t.pago === 'nomina' && (t.mesNomina || ymOf(t.fecha)) === ym ? t.coste : 0), 0); return v > 0 ? ` Este mes te descuentan unos ${eur(v)} de STBY.` : ''; };
const stbyResumenTxt = () => { const p = stbyPend(), v = p.reduce((a,t) => a + t.cobrar, 0); return p.length ? `${p.length} sin cobrar · te deben ${eur(v)}` : (S.stby.length ? 'Todo cobrado' : 'Billetes que sacas a otros'); };
function vStby(){
  if (!S.cfg) return vSinCfg('STBY');
  const cur = ymOf(hoyISO());
  const pend = stbyPend().sort((a,b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  const cob = S.stby.filter(t => t.cobrado).sort((a,b) => (a.fechaCobro || '') < (b.fechaCobro || '') ? 1 : -1);
  const debe = r2(pend.reduce((a,t) => a + t.cobrar, 0)), margen = r2(S.stby.reduce((a,t) => a + t.cobrar - t.coste, 0));
  const cobMes = r2(cob.reduce((a,t) => a + (ymOf(t.fechaCobro || '0000-00') === cur ? t.cobrar : 0), 0));
  const nom = {}; for (const t of S.stby){ if (t.pago !== 'nomina') continue; const ym = t.mesNomina || ymOf(t.fecha); (nom[ym] ||= {v:0, n:0}); nom[ym].v += t.coste; nom[ym].n++; }
  const per = {}; for (const t of pend){ const k = t.persona.trim().toLowerCase(); (per[k] ||= {n:t.persona.trim() || 'Sin nombre', v:0, ids:[]}); per[k].v += t.cobrar; per[k].ids.push(t.id); }
  const nb = n => `${n} ${n === 1 ? 'billete' : 'billetes'}`;
  const tile = (k, v, s, vc = '') => `<div class="tile"><p class="t-k">${k}</p><p class="t-v ${vc}">${v}</p>${s ? `<p class="t-s">${s}</p>` : ''}</div>`;
  const dif = t => { const d = r2(t.cobrar - t.coste); return Math.abs(d) < .005 ? '' : ` <span class="pill ${d > 0 ? 'ingreso' : 'ahorro'}">${d > 0 ? '+' : '−'}${eur(Math.abs(d))}</span>`; };
  const row = t => `<div class="srow2"><button class="mrow" data-act="edit-stby" data-id="${esc(t.id)}"><span class="mmain"><span class="mtitle">${esc(t.persona || 'Sin nombre')}${t.detalle ? ` · ${esc(t.detalle)}` : ''}</span><span class="mmeta">${cap(fechaCorta(t.fecha))} <span class="pill">${t.pago === 'nomina' ? `nómina de ${mesNombre(t.mesNomina || ymOf(t.fecha))}` : 'tarjeta'}</span>${dif(t)}${t.cobrado && t.fechaCobro ? ` · cobrado el ${fechaCorta(t.fechaCobro)}` : ''}</span></span><span class="mamt">${eur(t.cobrar)}</span></button>${t.cobrado ? '' : `<button class="btn small ghost" data-act="cobrar-stby" data-ids="${esc(t.id)}">Cobrado</button>`}</div>`;
  const meses = Object.keys(nom).sort().reverse().slice(0, 6), nc = nom[cur];
  const quien = Object.values(per).sort((a,b) => b.v - a.v);
  return vTop('STBY', {back:true, sub:'Billetes que sacas a otros'}) + banner() +
   `<div class="tiles">${tile('Te deben', eur(debe), pend.length ? `${nb(pend.length)} sin cobrar` : 'Nada pendiente')}
     ${tile('Cobrado este mes', eur(cobMes), cap(mesNombre(cur)))}
     ${tile(`Descuento en la nómina de ${mesNombre(cur)}`, eur(nc ? -nc.v : 0), nc ? nb(nc.n) : 'Ningún billete', nc ? 'neg' : '')}
     ${tile('Margen total', eur(margen, {signo:true}), 'Lo que cobras de más o de menos', margen < 0 ? 'neg' : margen > 0 ? 'pos' : '')}</div>
   <button class="btn primary wide" data-act="new-stby">+ Apuntar un billete</button>
   ${quien.length ? `<section class="card"><h2>Quién te debe</h2><div>${quien.map(x => `<div class="srow2"><span class="lrow-main" style="padding:12px 0"><span class="lrow-t">${esc(x.n)}</span><span class="lrow-s">${nb(x.ids.length)} · ${eur(x.v)}</span></span><button class="btn small ${x.ids.length > 1 ? 'primary' : 'ghost'}" data-act="cobrar-stby" data-ids="${x.ids.map(esc).join(',')}">${x.ids.length > 1 ? 'Cobrar todo' : 'Cobrado'}</button></div>`).join('')}</div></section>` : ''}
   <section class="card"><h2>Sin cobrar</h2>${pend.length ? `<div class="mlist">${pend.map(row).join('')}</div>` : `<p class="muted">${S.stby.length ? 'Todo cobrado.' : 'Cuando saques un billete para alguien, apúntalo aquí con lo que te cuesta y lo que le cobras. Cuando te pague, toca «Cobrado».'}</p>`}</section>
   ${meses.length ? `<section class="card"><div style="display:grid;gap:4px"><h2>Descuentos en tu nómina</h2><p class="muted">Lo que te descuentan de STBY en cada nómina.</p></div><div>${meses.map(ym => `<div class="lrow"><span class="lrow-main"><span class="lrow-t">${cap(mesAnyo(ym))}</span><span class="lrow-s">${nb(nom[ym].n)}</span></span><span class="lrow-v neg">${eur(-nom[ym].v)}</span></div>`).join('')}</div></section>` : ''}
   ${cob.length ? `<details class="card"><summary><span class="sumt"><b>Cobrados</b><small>${nb(cob.length)}</small></span><span class="chev" aria-hidden="true">›</span></summary><div class="mlist">${cob.slice(0, 40).map(row).join('')}</div></details>` : ''}`;
}
const VIEWS = {inicio:vInicio, resumen:vInicio, movimientos:vMovimientos, patrimonio:vPatrimonio, analisis:vAnalisis, proyeccion:vAnalisis, ajustes:vAjustes, mas:vAjustes, stby:vStby};

/* ===== Hojas ===== */
let lastFocus = null;
function openSheet(title, html, mount){
  S.sheetKind = null; lastFocus = document.activeElement; $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = html;
  const w = $('#sheet'); w.hidden = false; document.body.classList.add('noscroll'); $('.sheet').scrollTop = 0;
  if (mount) mount($('#sheetBody'));
}
function closeSheet(){ S.sheetKind = null; $('#sheet').hidden = true; document.body.classList.remove('noscroll'); $('#sheetBody').innerHTML = ''; try { lastFocus?.focus?.({preventScroll:true}); } catch {} }
function armar(btn, texto, fn){ btn.addEventListener('click', () => { if (btn.disabled) return; if (!btn.dataset.armed){ const t0 = btn.textContent; btn.dataset.armed = '1'; btn.textContent = texto; setTimeout(() => { if (btn.isConnected && btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = t0; } }, 3500); return; } delete btn.dataset.armed; fn(); }); }
function optsCuentas(conDeudas, filtro){
  let h = Object.keys(CTA_L).map(t => { const o = ordenCuentas().filter(c => c.tipo === t && (!filtro || filtro(c))).map(c => `<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join(''); return o ? `<optgroup label="${CTA_L[t]}">${o}</optgroup>` : ''; }).join('');
  if (conDeudas && S.deudas.length) h += `<optgroup label="Amortizar préstamo">${S.deudas.map(d => `<option value="deuda:${esc(d.id)}">${esc(d.nombre)}</option>`).join('')}</optgroup>`;
  return h || '<option value="">Sin cuentas</option>';
}
const optsCats = (tipo, sel) => S.cfg.categorias.filter(c => c.tipo === tipo && (!c.oculta || c.id === sel)).map(c => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
const setSel = (sel, v) => { if (v && [...sel.options].some(o => o.value === v)) sel.value = v; };
const segHTML = (tipos, cur) => `<div class="seg" role="group" aria-label="Tipo">${tipos.map(t => `<button type="button" data-t="${t}" aria-pressed="${t === cur}">${TIPO_L[t]}</button>`).join('')}</div>`;
const actions = (edit, label) => `<p class="err" role="alert"></p><div class="actions"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="submit" class="btn primary">${label || (edit ? 'Guardar' : 'Añadir')}</button></div>`;
const isYM = s => /^\d{4}-\d{2}$/.test(s);

/* Movimiento */
function sheetMov(m, pre = {}){
  const edit = !!m, st = {tipo: m?.tipo || pre.tipo || 'gasto', cat: m?.cat || pre.cat || null, ctaTocada: edit || !!pre.cuenta};
  const v = (k, d = '') => m?.[k] ?? pre[k] ?? d, imp = v('importe', '');
  st.off = m?.mes && monthsBetween(ymOf(m.fecha), m.mes) === -1 ? -1 : 0; st.offTocado = edit;
  openSheet(edit ? 'Editar movimiento' : 'Nuevo movimiento', `<form id="fMov" class="form" novalidate>
    ${segHTML(['gasto','ingreso','traspaso'], st.tipo)}<p class="hint" id="mHint"></p>
    <div class="fld"><label for="mImporte">Importe</label><div class="amount"><input id="mImporte" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${imp !== '' && isFinite(imp) ? fmtIn(imp) : ''}"><span aria-hidden="true">€</span></div>${pre.nota ? `<span class="note">${esc(pre.nota)}</span>` : ''}</div>
    <div class="fld" id="mCatWrap"><span class="lbl">Categoría</span><div class="chips" id="mCats"></div></div>
    <div class="fld" id="mCtaWrap"><label for="mCuenta">Cuenta</label><select id="mCuenta">${optsCuentas()}</select>${S.cuentas.some(c => c.tipo === 'hucha') ? '<span class="note" id="mCtaNote">¿Lo pagas con dinero de una hucha? Elígela aquí y no hace falta anotar el traspaso.</span>' : ''}</div>
    <div class="grid2" id="mTrasWrap"><div class="fld"><label for="mDesde">Desde</label><select id="mDesde">${optsCuentas()}</select></div><div class="fld"><label for="mHacia">Hacia</label><select id="mHacia">${optsCuentas(true)}</select></div><p class="note full" id="mTrasNote"></p></div>
    <div class="fld"><label for="mDetalle">Detalle <i>(opcional)</i></label><input id="mDetalle" autocomplete="off" placeholder="Ej: compra del finde" value="${esc(v('detalle'))}"></div>
    <div class="fld"><label for="mFecha">Fecha</label><input type="date" id="mFecha" value="${esc(v('fecha', hoyISO()))}"></div>
    <div class="fld" id="mMesW"><span class="lbl">Cuenta en el mes de</span><div class="seg" id="mMes" role="group" aria-label="Mes en que cuenta"><button type="button" data-o="0"></button><button type="button" data-o="-1"></button></div><span class="note">Si cobras a principios de mes lo del mes anterior, elige el anterior.</span></div>
    <p class="note" id="mBaseNote" hidden></p>
    ${!edit ? '<label class="check"><input type="checkbox" id="mRepite"><span>Se repite todos los meses este mismo día</span></label>' : m.rec ? '<p class="note">Viene de un fijo mensual. Si lo cambias, solo cambia el de este mes.</p>' : ''}
    ${actions(edit)}${edit ? '<button type="button" class="btn danger" id="mDel">Eliminar movimiento</button>' : `<button type="button" class="btn danger" data-act="new-stby" style="color:var(--accent)">${ic('ticket', 18)} ¿Es un billete STBY? Apúntalo aquí</button>`}</form>`, root => {
    const q = s => root.querySelector(s), selC = q('#mCuenta'), selD = q('#mDesde'), selH = q('#mHacia'), cfg = S.cfg;
    setSel(selC, v('cuenta') || cfg.cuentaPrincipal); setSel(selD, v('desde') || cfg.cuentaPrincipal);
    setSel(selH, v('hacia') || S.cuentas.find(c => c.tipo === 'hucha')?.id);
    const defCta = () => (st.tipo === 'gasto' && cat(st.cat)?.grupo === 'sobre' && cfg.sobre.cuenta) ? cfg.sobre.cuenta : (cfg.cuentaPrincipal || S.cuentas[0]?.id || '');
    const nota = () => { const d = S.cuentas.find(c => c.id === selD.value), h = S.cuentas.find(c => c.id === selH.value), n = q('#mTrasNote'); n.className = 'note full';
      if (selH.value.startsWith('deuda:')) n.textContent = 'Amortización anticipada: baja el capital pendiente del préstamo.';
      else if (selD.value === selH.value){ n.textContent = 'Elige dos cuentas distintas.'; n.classList.add('warn'); }
      else if (esAhorro(d) && !esAhorro(h)){ n.textContent = 'Esto cuenta como dinero sacado de ahorros.'; n.classList.add('warn'); }
      else if (esAhorro(h) && !esAhorro(d)){ n.textContent = 'Esto cuenta como ahorro del mes.'; n.classList.add('good'); }
      else if (h?.tipo === 'hucha' && d?.tipo !== 'hucha') n.textContent = 'Apartas dinero en la hucha para gastarlo más adelante.';
      else if (d?.tipo === 'hucha') n.textContent = 'Usas dinero de la hucha: es normal y no cuenta como sacar de ahorros.';
      else n.textContent = ''; };
    const baseNote = () => { const n = q('#mBaseNote'), f = q('#mFecha').value || hoyISO();
      const ids = st.tipo === 'traspaso' ? [selD.value, selH.value] : [selC.value];
      const c = ids.map(id => S.cuentas.find(x => x.id === id)).find(x => x && x.fechaBase && f < x.fechaBase);
      n.hidden = !c; if (c) n.textContent = `Es anterior al ${fechaCorta(c.fechaBase)}, cuando pusiste el saldo de ${c.nombre}: no cambia el saldo, solo cuenta en tus números del mes.`; };
    const syncMes = () => { const w = q('#mMesW'); w.hidden = st.tipo !== 'ingreso'; if (w.hidden) return;
      const f = q('#mFecha').value || hoyISO(), ym = ymOf(f);
      if (!st.offTocado) st.off = (st.cat === 'nomina' && Number(f.slice(8)) <= 7) ? -1 : 0;
      w.querySelectorAll('button').forEach(b => { const o = Number(b.dataset.o); b.textContent = cap(mesNombre(addMonths(ym, o))); b.setAttribute('aria-pressed', String(o === st.off)); }); };
    const sync = () => {
      root.querySelectorAll('.seg button[data-t]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === st.tipo)));
      q('#mHint').textContent = HINT[st.tipo]; const tras = st.tipo === 'traspaso';
      q('#mCatWrap').hidden = tras; q('#mCtaWrap').hidden = tras; q('#mTrasWrap').hidden = !tras;
      const cn = q('#mCtaNote'); if (cn) cn.hidden = st.tipo !== 'gasto';

      if (tras){ nota(); return; }
      const cats = cfg.categorias.filter(c => c.tipo === st.tipo && (!c.oculta || c.id === st.cat)); if (!cats.some(c => c.id === st.cat)) st.cat = null;
      q('#mCats').innerHTML = cats.map(c => `<button type="button" class="chip" data-cat="${esc(c.id)}" aria-pressed="${c.id === st.cat}">${esc(c.nombre)}</button>`).join('');

      e.preventDefault(); const err = q('.err'); err.textContent = '';
      const val = parseImporte(q('#mImporte').value);
      if (!(val > 0)){ err.textContent = 'Escribe un importe mayor que cero.'; q('#mImporte').focus(); return; }

      const doc = {fecha, tipo:st.tipo, importe:r2(val), detalle:q('#mDetalle').value.trim(), cat:null, cuenta:null, desde:null, hacia:null, rec:m?.rec || null, mes: st.tipo === 'ingreso' && st.off ? addMonths(ymOf(fecha), st.off) : null, creado:m?.creado || new Date().toISOString()};
      if (st.tipo === 'traspaso'){ if (!selD.value || !selH.value || selD.value === selH.value){ err.textContent = 'Elige de qué cuenta sale y a cuál va.'; return; } doc.desde = selD.value; doc.hacia = selH.value; }
      else { if (!st.cat){ err.textContent = 'Elige una categoría.'; return; } doc.cat = st.cat; doc.cuenta = selC.value || null; }
      const id = m?.id || uid('m'), repite = q('#mRepite')?.checked;
      closeSheet();
      const ok = await guardar(() => store.set('mov', id, doc), edit ? 'Cambios guardados' : `Anotado: ${eur(val)}${doc.cat ? ` en ${catNombre(doc.cat)}` : ''}`, edit ? null : () => guardar(() => store.del('mov', id), 'Deshecho'));
      if (ok && repite){ await guardar(() => store.set('rec', uid('r'), {tipo:doc.tipo, detalle:doc.detalle || (doc.cat ? catNombre(doc.cat) : 'Traspaso'), importe:doc.importe, cat:doc.cat, cuenta:doc.cuenta, desde:doc.desde, hacia:doc.hacia, dia:Number(fecha.slice(8)), inicio:addMonths(ymOf(fecha), 1), activo:true, omitidos:[], creado:new Date().toISOString()}), 'Anotado y guardado como fijo mensual'); }
    });
    const del = q('#mDel'); if (del) armar(del, 'Toca otra vez para eliminar', async () => {
      closeSheet(); const copia = strip(m);
      await guardar(async () => { await store.del('mov', m.id); const rc = m.rec && S.recs.find(r => r.id === m.rec); if (rc){ const om = new Set(rc.omitidos||[]); om.add(ymOf(m.fecha)); await store.set('rec', rc.id, {...strip(rc), omitidos:[...om]}); } }, 'Movimiento eliminado', () => guardar(() => store.set('mov', m.id, copia), 'Recuperado'));
    });
  });
}

      if (capi > 0 && cuota <= capi*tin/1200){ err.textContent = 'Con esa cuota no se cubren ni los intereses. Revisa cuota y TIN.'; return; }

      const crear = q('#dRec')?.checked; closeSheet();
      const ok = await guardar(async () => {

        const rc = S.recs.find(r => r.deuda === id);

    <details class="editbox"><summary>Editar datos del préstamo</summary>${form}</details></div>`, root => {

      const finP = addMonths(e.proxYm, R.plazo.n - 1);

/* Pagos con la Cartera del iPhone: un atajo abre la app con #gasto~IMPORTE~COMERCIO[~CUENTA] */
const ARTIFACT_URL = 'https://claude.ai/artifact/8fCZYDDAtEVz6MUyC1g6Ay';
const CARTERA_REGEX = '[^A-Za-z0-9.~-]+';
const appUrl = () => S.mode === 'db' ? ARTIFACT_URL : location.href.split('#')[0];
const bonito = s => String(s || '').trim().toLowerCase().replace(/(^|\s)(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
function leerHashCartera(){
  let h = ''; try { h = decodeURIComponent((location.hash || '').slice(1)); } catch { h = (location.hash || '').slice(1); }
  if (!/^gasto(~|$)/i.test(h)) return null;
  const [, imp = '', com = '', cta = ''] = h.split('~');
  let a = imp.replace(/[^0-9.]/g, ''); const ps = a.split('.'); if (ps.length > 2) a = ps.slice(0, -1).join('') + '.' + ps[ps.length - 1];
  const n = parseFloat(a);
  return {h, importe: isFinite(n) && n > 0 ? r2(n) : '', comercio: com.replace(/_+/g, ' ').trim(), cta: cta.replace(/_+/g, ' ').trim().toLowerCase()};
}
function abrirDesdeCartera(){
  const p = leerHashCartera(); if (!p || !S.cfg) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  try { const last = JSON.parse(localStorage.getItem('cartera-ultimo') || 'null'); if (last && last.h === p.h && Date.now() - last.t < 60000) return; localStorage.setItem('cartera-ultimo', JSON.stringify({h:p.h, t:Date.now()})); } catch {}
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  const nc = norm(p.comercio), prev = nc ? S.movs.find(m => m.tipo === 'gasto' && norm(m.detalle) === nc) : null;
  let cat = prev?.cat || null, cuenta = prev?.cuenta || null;
  if (!cat && p.comercio){ const g = parseRapido(p.comercio + ' 1', S.cfg.categorias, hoyISO()); cat = g?.cat || null; }
  if (p.cta){ const c = S.cuentas.find(x => x.nombre.toLowerCase().split(/[^\p{L}\p{N}]+/u).some(w => w.length >= 3 && p.cta.includes(w))); if (c) cuenta = c.id; }
  if (!cuenta) cuenta = S.cfg.sobre.cuenta || S.cfg.cuentaPrincipal || null;
  if (!$('#sheet').hidden) closeSheet();
  S.tab = 'inicio'; render();
  sheetMov(null, {tipo:'gasto', importe:p.importe, detalle:bonito(p.comercio), cat, cuenta,
    nota: prev ? `Categoría y cuenta como la última vez en ${bonito(p.comercio)}. Revisa y pulsa Añadir.` : 'Pago con la Cartera. Revisa la categoría y pulsa Añadir.'});
}
window.addEventListener('hashchange', () => { if (S.cfg) abrirDesdeCartera(); });
function sheetCartera(){
  const copia = (id, val, label) => `<div class="fld"><span class="lbl">${label}</span><div class="copyrow"><input id="${id}" readonly value="${esc(val)}" aria-label="${label}"><button type="button" class="btn small ghost" data-copy="${id}">Copiar</button></div></div>`;

function sheetReset(){
  const man = S.movs.filter(m => !m.rec), auto = S.movs.length - man.length;
  const li = (n, uno, varios) => n ? `<li><span>${n} ${n === 1 ? uno : varios}</span></li>` : '';
  openSheet('Reiniciar configuración', `<div class="form">
    <p class="lead">Borra la configuración y vuelve a abrir el asistente para hacerla de nuevo. No se puede deshacer.</p>
    <div><h3 class="section-t" style="margin-bottom:10px">Se borra</h3><ul class="feat">${li(S.cuentas.length, 'cuenta', 'cuentas')}${li(S.recs.length, 'fijo mensual', 'fijos mensuales')}${li(S.deudas.length, 'préstamo', 'préstamos')}${li(S.plans.length, 'planificado', 'planificados')}${li(S.objs.length, 'objetivo', 'objetivos')}${li(S.stby.length, 'billete de STBY', 'billetes de STBY')}${li(auto, 'movimiento anotado por un fijo', 'movimientos anotados por los fijos')}<li><span>Sobre, sueldo, pagas, categorías y presupuesto</span></li></ul></div>
    ${man.length ? `<label class="check"><input type="checkbox" id="rsKeep" checked><span>Conservar ${man.length === 1 ? 'el movimiento que anotaste' : `los ${man.length} movimientos que anotaste`} a mano</span></label><p class="note">Se vuelven a enlazar con tus cuentas nuevas si en el asistente les pones el mismo nombre.</p>` : ''}
    <button type="button" class="btn ghost" data-act="export-json">Descargar una copia antes</button>
    <p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="button" class="btn danger-fill" id="rsGo">Borrar y empezar</button></div></div>`, root => {
    const go = root.querySelector('#rsGo');
    armar(go, 'Toca otra vez para borrar', async () => {
      const keep = !!root.querySelector('#rsKeep')?.checked;
      S.reseteando = true;
      const tareas = [...S.recs.map(x => ['rec', x.id]), ...S.movs.filter(m => !keep || m.rec).map(m => ['mov', m.id]), ...S.plans.map(x => ['plan', x.id]), ...S.objs.map(x => ['obj', x.id]), ...S.stby.map(x => ['stby', x.id]),...S.deudas.map(x => ['deudas', x.id]), ...S.cuentas.map(x => ['cuentas', x.id])];
      const viejas = {cuentas:Object.fromEntries(S.cuentas.map(c => [c.id, c.nombre])), deudas:Object.fromEntries(S.deudas.map(d => [d.id, d.nombre]))};
      const conservar = keep && man.length > 0;
      go.disabled = true; go.textContent = 'Borrando…';
      const ok = await guardar(async () => {
        if (conservar) await store.setMeta(viejas);
        for (let i = 0; i < tareas.length; i += 10){ await Promise.all(tareas.slice(i, i + 10).map(([c, id]) => store.del(c, id))); if (go.isConnected) go.textContent = `Borrando… ${Math.min(i + 10, tareas.length)} de ${tareas.length}`; }
        await store.delCfg();
      });
      S.reseteando = false;
      if (ok){ S.generado = false; S.mes = null; S.tab = 'inicio'; window.scrollTo(0,0); closeSheet(); toast('Configuración borrada. Vuelve a empezar.'); sheetSetup(); }
      else if (go.isConnected){ go.disabled = false; go.textContent = 'Borrar y empezar'; }
    });
  });
}

      const aps = []; for (const k of SU.a){ const c = q('#su-ac-'+k).value.trim(), raw = q('#su-ai-'+k).value.trim(), i = parseImporte(raw); if (!c && !raw) continue; if (!(i > 0)) return fail(`Pon el importe de «${c || 'aporte'}».`, q('#su-ai-'+k)); const h = idOf[q('#su-ah-'+k).value]; if (!h) return fail('Elige a qué cuenta va el aporte.', q('#su-ah-'+k)); aps.push({c: c || 'Aporte', i:r2(i), d:dia(q('#su-ad-'+k).value), h}); }

      const ppal = idOf[q('#suNomCta').value] || idOf[cs[0].k];
      const go = q('#suGo'); go.disabled = true; go.textContent = 'Creando…';
      const now = () => new Date().toISOString(), cats = CATS_DEF.map(x => ({...x, presupuesto:0}));
      const ok = await guardar(async () => {
        let i = 0; for (const c of cs){ const t = now(); await store.set('cuentas', idOf[c.k], {nombre:c.nombre.trim(), tipo:c.tipo, saldoBase:r2(parseImporte(c.saldo) || 0), fechaBase:hoy, baseTs:t, orden:i++, creado:t}); }
        if (nomina > 0) await store.set('rec', uid('r'), {tipo:'ingreso', detalle:'Nómina', importe:r2(nomina), cat:'nomina', cuenta:ppal, desde:null, hacia:null, dia:nomDia, inicio:cur, activo:true, variable:SU.varia, omitidos:[], creado:now()});
        if (deuda){ const {id, ...dd} = deuda; await store.set('deudas', id, {...dd, creado:now()}); await store.set('rec', uid('r'), {tipo:'gasto', detalle:'Cuota del préstamo', importe:dd.cuota, cat:'deudas', cuenta:dd.cuenta || ppal, desde:null, hacia:null, dia:dd.dia, inicio:cur, activo:true, omitidos:[], deuda:id, creado:now()}); }
        for (const f of fijos){ const p = parseRapido(f.c + ' 1', cats, hoy); await store.set('rec', uid('r'), {tipo:'gasto', detalle:f.c, importe:f.i, cat:p?.cat || 'casa', cuenta:ppal, desde:null, hacia:null, dia:f.d, inicio:cur, activo:true, omitidos:[], creado:now()}); }
        for (const a of aps) await store.set('rec', uid('r'), {tipo:'traspaso', detalle:a.c, importe:a.i, cat:null, cuenta:null, desde:ppal, hacia:a.h, dia:a.d, inicio:cur, activo:true, omitidos:[], creado:now()});
        const meta = await store.getMeta();
        if (meta && meta.cuentas){
          const porNombre = Object.fromEntries(cs.map(c => [c.nombre.trim().toLowerCase(), idOf[c.k]])), mapa = {};
          for (const [viejo, nom] of Object.entries(meta.cuentas)){ const n = porNombre[String(nom).trim().toLowerCase()]; if (n) mapa[viejo] = n; }
          if (deuda) for (const viejo of Object.keys(meta.deudas || {})) mapa['deuda:' + viejo] = 'deuda:' + deuda.id;
          for (const m of [...S.movs]){ const nv = {}; for (const k of ['cuenta','desde','hacia']) if (m[k] && mapa[m[k]]) nv[k] = mapa[m[k]]; if (Object.keys(nv).length) await store.set('mov', m.id, {...strip(m), ...nv}); }
          await store.delMeta();
        }
        await store.setCfg({nombre:'Jordi', categorias:cats, cuentaPrincipal:ppal, sueldo:{pagas:SU.pagas, extra: SU.pagas === 14 ? r2(parseImporte(q('#suExtra').value) || 0) : 0, meses:[6,12]},
          sobre:{importe:r2(sobre), dia:Number(q('#suSobreDia').value), cuenta:idOf[q('#suSobreCta').value] || '', origen:idOf[q('#suSobreOri').value] || ''}, ipc:IPC_DEF, creado:now()});
      }, 'Listo. Ya puedes anotar tus gastos.');
      if (ok){ closeSheet(); S.tab = 'inicio'; window.scrollTo(0,0); schedule(); setTimeout(generarRecurrentes, 500); }

/* ===== Importar una copia (la de claude.ai u otra de esta app) ===== */
const COPIA = {cuentas:'cuentas', mov:'movimientos', rec:'fijos', plan:'planificados', deudas:'prestamos', obj:'objetivos', stby:'stby'};
async function leerCopia(inp){
  const f = inp.files?.[0]; if (!f) return;
  let d = null; try { d = JSON.parse(await f.text()); } catch {}
  inp.value = '';
  if (!d || typeof d !== 'object' || !d.config || typeof d.config !== 'object' || !Array.isArray(d.movimientos)) return toast('Ese archivo no es una copia de seguridad de la app.');
  sheetImportar(d);
}
function importarCopia(d){
  const cfg = normCfg(d.config), cols = {};
  for (const [col, k] of Object.entries(COPIA)) cols[col] = (Array.isArray(d[k]) ? d[k] : []).filter(x => x && x.id).map(x => normDoc(col, String(x.id), x));
  if (S.mode === 'local'){
    for (const ks of Object.values(local.docs())) for (const k of ks) local.escribir(k, null);
    for (const [col, arr] of Object.entries(cols)) for (const doc of arr) local.escribir(`${col}/${doc.id}`, doc);
    local.escribir('meta', null); local.escribir('cfg', cfg);
  }
  for (const [col, key] of Object.entries(COLS)) S[key] = cols[col];
  S.cfg = cfg; S.meta = null; S.mes = null; S.generado = false;
  after();
  programarSync(0);
}
function sheetImportar(d){
  const n = k => Array.isArray(d[k]) ? d[k].filter(x => x && x.id).length : 0;
  const li = (v, uno, varios) => v ? `<li><span>${v} ${v === 1 ? uno : varios}</span></li>` : '';
  const ex = new Date(d.exportado), cuando = isFinite(ex) ? ` del ${fechaLarga(toISO(ex)).toLowerCase()}` : '';
  const hay = !!(S.cfg || S.movs.length || S.cuentas.length);
  openSheet('Importar una copia', `<div class="form">
    <p class="lead">Copia de seguridad${cuando}. Trae:</p>
    <ul class="feat">${li(n('cuentas'), 'cuenta', 'cuentas')}${li(n('movimientos'), 'movimiento', 'movimientos')}${li(n('fijos'), 'fijo mensual', 'fijos mensuales')}${li(n('prestamos'), 'préstamo', 'préstamos')}${li(n('planificados'), 'planificado', 'planificados')}${li(n('objetivos'), 'objetivo', 'objetivos')}${li(n('stby'), 'billete de STBY', 'billetes de STBY')}<li><span>Sobre, sueldo, categorías y presupuesto</span></li></ul>
    ${hay ? '<p class="note warn">Sustituye todo lo que tienes ahora en esta app' + (S.sync?.token ? ' y en GitHub' : '') + '.</p><button type="button" class="btn ghost" data-act="export-json">Descargar una copia antes</button>' : ''}
    <p class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="button" class="btn primary" id="imGo">Importar</button></div></div>`, root => {
